# Lint and type-check config for the hub's stdlib-only utility scripts (spec/, host-setup/) - the
# "Scripts" profile from CODESTYLE.md: config only, no [project]/[build-system]/uv.lock, with mypy the
# type-check gate and pyright/pylance editor-only (standard mode). Mirrors the fleet's Python style.

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
extend-select = ["I"]  # isort import ordering, on top of the default rules

[tool.mypy]
python_version = "3.13"
files = ["spec", "host-setup"]

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "standard"
include = ["spec", "host-setup"]
exclude = ["**/__pycache__"]
