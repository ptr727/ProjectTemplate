# Lint and type-check configuration for the hub's stdlib-only utility scripts (spec/, host-setup/).
# The hub ships no Python package, so there is no [project] or [build-system] - this is config only,
# the "uvx scripts" profile from CODESTYLE.md (no uv.lock). It mirrors the fleet's Python style.

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
extend-select = ["I"]  # isort import ordering, on top of the default rules

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "standard"
include = ["spec", "host-setup"]
exclude = ["**/__pycache__"]
