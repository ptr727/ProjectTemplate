# Config only (no [project]/[build-system]/uv.lock) - the Scripts profile, CODESTYLE.md "Two profiles".

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
extend-select = ["I"]  # isort import ordering, on top of the default rules

[tool.mypy]
python_version = "3.13"
files = ["spec", "host-setup", "scripts"]
mypy_path = [".github/actions/prose-gate", ".github/actions/repo-gate"]
exclude = ["scripts/prose_lint.py", "scripts/repo_gate.py"]

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "standard"
include = ["spec", "host-setup", "scripts"]
exclude = ["**/__pycache__"]
