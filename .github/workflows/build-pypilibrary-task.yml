name: Build PyPI library task

# This reusable workflow only builds the PyPI library and uploads the
# wheel + sdist as a workflow-run artifact. It does NOT publish to PyPI.
# Publishing happens directly in `publish-release.yml` so that the
# `id-token: write` permission required by Trusted Publishing is granted
# at the entry-point job, not propagated through a reusable-workflow
# chain (which would require every caller — including `test-release-task.yml`
# during PR validation — to also grant id-token write, even when no
# publishing happens).

on:
  workflow_call:
    outputs:
      artifact-name:
        value: ${{ jobs.build-pypilibrary.outputs.artifact-name }}
      artifact-id:
        value: ${{ jobs.build-pypilibrary.outputs.artifact-id }}

jobs:

  get-version:
    name: Get version information job
    uses: ./.github/workflows/get-version-task.yml

  build-pypilibrary:
    name: Build PyPI library project job
    runs-on: ubuntu-latest
    needs: [get-version]
    defaults:
      run:
        working-directory: ./PyPiLibrary
    outputs:
      artifact-name: pypilibrary-build
      artifact-id: ${{ steps.artifact-upload-step.outputs.artifact-id }}

    steps:

      - name: Checkout code step
        uses: actions/checkout@v6

      - name: Setup uv step
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          # Pin uv to the same version as `.devcontainer/python/post-create.sh`
          # (UV_VERSION) so CI and local devcontainer behavior cannot drift
          # — same uv resolves the same lockfile the same way. Bump in lock-
          # step with the devcontainer pin.
          version: "0.11.8"
          enable-cache: true
          cache-dependency-glob: "PyPiLibrary/uv.lock"

      - name: Sync dependencies step
        run: uv sync --all-groups --frozen

      - name: Lint with ruff step
        run: uv run ruff check

      - name: Verify formatting with ruff step
        run: uv run ruff format --check

      - name: Type check with pyright step
        run: uv run pyright

      - name: Run pytest step
        run: uv run pytest

      # Replace the `__version__` line in `_version.py` (which ships
      # hardcoded "0.0.0" so local `uv build` works without CI) with
      # NBGV's `AssemblyFileVersion` — always Major.Minor.Patch.BuildNumber,
      # all numeric, PEP 440 valid. `sed -i` replaces the line in place so
      # the module docstring and any future metadata in the file survive
      # into the published wheel / sdist. `_version.py` is the single
      # source `hatchling` reads via the `[tool.hatch.version]` path in
      # pyproject.toml. Done AFTER tests so the test that asserts
      # `__version__` is a non-empty string isn't affected. The PyPI
      # version string therefore equals the .NET assemblies' `FileVersion`
      # stamp (= NBGV `AssemblyFileVersion`). .NET's `AssemblyVersion`
      # is a separate NBGV output and NuGet `PackageVersion` / Docker
      # tags use NBGV `SemVer2` (PEP 440 rejects its prerelease /
      # build-metadata suffixes), so those strings are not byte-identical
      # to PyPI's; all four still derive from the same NBGV computation
      # per release commit.
      - name: Write version into _version.py step
        run: |
          set -euo pipefail
          sed -i 's/^__version__ = .*/__version__ = "'"$VERSION"'"/' src/ptr727_projecttemplate_library/_version.py
        env:
          VERSION: ${{ needs.get-version.outputs.AssemblyFileVersion }}

      - name: Build sdist and wheel step
        run: uv build

      - name: Upload build artifacts step
        id: artifact-upload-step
        uses: actions/upload-artifact@v6
        with:
          name: pypilibrary-build
          path: PyPiLibrary/dist/*
