name: Build PyPI library task

# This reusable workflow only builds the PyPI library and uploads the
# wheel + sdist as a workflow-run artifact. It does NOT publish to PyPI.
# Publishing happens directly in `publish-release.yml` so that the
# `id-token: write` permission required by Trusted Publishing is granted
# at the entry-point job, not propagated through a reusable-workflow
# chain (which would require every caller — including `test-release-task.yml`
# during PR validation — to also grant id-token write, even when no
# publishing happens).

on:
  workflow_call:
    outputs:
      artifact-name:
        value: ${{ jobs.build-pypilibrary.outputs.artifact-name }}
      artifact-id:
        value: ${{ jobs.build-pypilibrary.outputs.artifact-id }}

jobs:

  get-version:
    name: Get version information job
    uses: ./.github/workflows/get-version-task.yml

  build-pypilibrary:
    name: Build PyPI library project job
    runs-on: ubuntu-latest
    needs: [get-version]
    defaults:
      run:
        working-directory: ./PyPiLibrary
    outputs:
      artifact-name: pypilibrary-build
      artifact-id: ${{ steps.artifact-upload-step.outputs.artifact-id }}

    steps:

      - name: Checkout code step
        uses: actions/checkout@v6

      - name: Setup uv step
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          # Pin uv to the same version as `.devcontainer/python/post-create.sh`
          # (UV_VERSION) so CI and local devcontainer behavior cannot drift
          # — same uv resolves the same lockfile the same way. Bump in lock-
          # step with the devcontainer pin.
          version: "0.11.8"
          enable-cache: true
          cache-dependency-glob: "PyPiLibrary/uv.lock"

      - name: Sync dependencies step
        run: uv sync --all-groups --frozen

      - name: Lint with ruff step
        run: uv run ruff check

      - name: Verify formatting with ruff step
        run: uv run ruff format --check

      - name: Type check with pyright step
        run: uv run pyright

      - name: Run pytest step
        run: uv run pytest

      # Compute the PEP 440 version string for this build:
      #   refs/heads/main    -> AssemblyFileVersion as-is. PEP 440 treats
      #                         this 4-segment numeric form as a release.
      #   refs/heads/develop -> Major.Minor.Patch.devN (PEP 440 dev
      #                         release; pip filters it out of `pip
      #                         install <pkg>` unless `--pre` is passed,
      #                         giving us a "prerelease channel" on the
      #                         same PyPI project. N is NBGV's
      #                         BuildNumber, so each develop push gets a
      #                         unique upload.)
      #   other refs (PR validation via test-release-task, feature
      #                branches) -> AssemblyFileVersion as-is. These
      #                refs never publish, so any PEP 440 valid string
      #                that lets `uv build` succeed is fine.
      - name: Compute PyPI version step
        id: pypiver
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == "refs/heads/develop" ]]; then
            IFS='.' read -r major minor patch build <<< "$AFV"
            version="${major}.${minor}.${patch}.dev${build}"
          else
            version="$AFV"
          fi
          echo "PyPI version for $GITHUB_REF: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
        env:
          AFV: ${{ needs.get-version.outputs.AssemblyFileVersion }}

      # Replace the `__version__` line in `_version.py` (which ships
      # hardcoded "0.0.0" so local `uv build` works without CI) with the
      # branch-aware PEP 440 version computed above. `sed -i` replaces
      # the line in place so the module docstring and any future metadata
      # in the file survive into the published wheel / sdist.
      # `_version.py` is the single source `hatchling` reads via the
      # `[tool.hatch.version]` path in pyproject.toml. Done AFTER tests
      # so the test that asserts `__version__` is a non-empty string
      # isn't affected. On main, the PyPI version string equals the .NET
      # assemblies' `FileVersion` stamp (= NBGV `AssemblyFileVersion`);
      # on develop, the PyPI version is `M.N.P.devB` while .NET still
      # uses the numeric `FileVersion` and NuGet/Docker use NBGV
      # `SemVer2` (different formats — strings are not byte-identical
      # across artifacts on develop). All four still derive from the
      # same NBGV computation per release commit.
      - name: Write version into _version.py step
        run: |
          set -euo pipefail
          sed -i 's/^__version__ = .*/__version__ = "'"$VERSION"'"/' src/ptr727_projecttemplate_library/_version.py
        env:
          VERSION: ${{ steps.pypiver.outputs.version }}

      - name: Build sdist and wheel step
        run: uv build

      - name: Upload build artifacts step
        id: artifact-upload-step
        uses: actions/upload-artifact@v6
        with:
          name: pypilibrary-build
          path: PyPiLibrary/dist/*
