name: Build PyPI library task

# This reusable workflow only builds the PyPI library and uploads the
# wheel + sdist as a workflow-run artifact. It does NOT publish to PyPI.
# Publishing happens directly in `publish-release.yml` so that the
# `id-token: write` permission required by Trusted Publishing is granted
# at the entry-point job, not propagated through a reusable-workflow
# chain (which would require every caller — including the PR smoke build in
# `test-pull-request.yml` — to also grant id-token write, even when no
# publishing happens).

on:
  workflow_call:
    inputs:
      # Git ref to check out / version (empty = default checkout ref).
      ref:
        required: false
        type: string
        default: ''
      # Logical branch driving the PEP 440 version (`develop` => `.dev0`
      # prerelease suffix, anything else => plain release). Required (no
      # `github.ref_name` fallback, which would mislabel the develop leg of
      # the publisher's matrix); the orchestrator passes it.
      branch:
        required: true
        type: string
    outputs:
      artifact-name:
        value: ${{ jobs.build-pypilibrary.outputs.artifact-name }}
      artifact-id:
        value: ${{ jobs.build-pypilibrary.outputs.artifact-id }}

jobs:

  get-version:
    name: Get version information job
    uses: ./.github/workflows/get-version-task.yml
    with:
      ref: ${{ inputs.ref }}

  build-pypilibrary:
    name: Build PyPI library project job
    runs-on: ubuntu-latest
    needs: [get-version]
    defaults:
      run:
        working-directory: ./PyPiLibrary
    outputs:
      artifact-name: pypilibrary-build-${{ inputs.branch }}
      artifact-id: ${{ steps.artifact-upload-step.outputs.artifact-id }}

    steps:

      - name: Checkout code step
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.ref }}

      - name: Setup uv step
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          # Pin uv to the same version as `.devcontainer/python/post-create.sh`
          # (UV_VERSION) so CI and local devcontainer behavior cannot drift
          # — same uv resolves the same lockfile the same way. Bump in lock-
          # step with the devcontainer pin.
          version: "0.11.8"
          enable-cache: true
          cache-dependency-glob: "PyPiLibrary/uv.lock"

      - name: Sync dependencies step
        run: uv sync --all-groups --frozen

      - name: Lint with ruff step
        run: uv run ruff check

      - name: Verify formatting with ruff step
        run: uv run ruff format --check

      - name: Type check with pyright step
        run: uv run pyright

      - name: Run pytest step
        run: uv run pytest

      # Compute the PEP 440 version string for this build:
      #   refs/heads/main    -> AssemblyFileVersion as-is
      #                         (`Major.Minor.Patch.BuildNumber`). PEP 440
      #                         treats this 4-segment numeric form as a
      #                         release.
      #   refs/heads/develop -> `${AssemblyFileVersion}.dev0`
      #                         (`Major.Minor.Patch.BuildNumber.dev0`).
      #                         The BuildNumber stays in the release
      #                         segment so develop's release segment
      #                         (which grows past main's after every
      #                         new commit) compares higher than main's
      #                         under PEP 440 ordering — so `pip install
      #                         --pre <pkg>` picks the develop dev
      #                         build, while default `pip install <pkg>`
      #                         filters the dev suffix and picks the
      #                         main release. The `.dev0` literal is a
      #                         constant because BuildNumber alone
      #                         already differentiates each develop
      #                         push (NBGV BuildNumber increments per
      #                         commit), so we don't need a second
      #                         counter in the dev segment.
      #
      #                         Edge case: in the window between a
      #                         release merge to main and the next
      #                         commit on develop, develop's
      #                         BuildNumber equals main's (or is one
      #                         lower) — `--pre` will still resolve to
      #                         the main release until a new develop
      #                         commit lands. This is accepted as a
      #                         small, self-healing gap.
      #   other branches (PR smoke build via test-pull-request, feature
      #                branches) -> AssemblyFileVersion as-is. These
      #                never publish; we just need a PEP 440 valid
      #                string for `uv build`.
      - name: Compute PyPI version step
        id: pypiver
        run: |
          set -euo pipefail
          if [[ "$BRANCH" == "develop" ]]; then
            version="${AFV}.dev0"
          else
            version="$AFV"
          fi
          echo "PyPI version for branch $BRANCH: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
        env:
          AFV: ${{ needs.get-version.outputs.AssemblyFileVersion }}
          BRANCH: ${{ inputs.branch }}

      # Replace the `__version__` line in `_version.py` (which ships
      # hardcoded "0.0.0" so local `uv build` works without CI) with the
      # branch-aware PEP 440 version computed above. `sed -i` replaces
      # the line in place so the module docstring and any future metadata
      # in the file survive into the published wheel / sdist.
      # `_version.py` is the single source `hatchling` reads via the
      # `[tool.hatch.version]` path in pyproject.toml. Done AFTER tests
      # so the test that asserts `__version__` is a non-empty string
      # isn't affected. On main, the PyPI version string equals the .NET
      # assemblies' `FileVersion` stamp (= NBGV `AssemblyFileVersion`,
      # `M.N.P.B`); on develop, the PyPI version is `M.N.P.B.dev0` —
      # numerically the same `FileVersion` with a trailing `.dev0`
      # prerelease marker. .NET keeps the bare `FileVersion`, and
      # NuGet/Docker use NBGV `SemVer2`, so strings are not byte-
      # identical across artifacts on either channel. All four still
      # derive from the same NBGV computation per commit (main pushes
      # publish release versions; develop pushes publish PEP 440 dev
      # releases / NBGV prereleases).
      - name: Write version into _version.py step
        run: |
          set -euo pipefail
          sed -i 's/^__version__ = .*/__version__ = "'"$VERSION"'"/' src/ptr727_projecttemplate_library/_version.py
        env:
          VERSION: ${{ steps.pypiver.outputs.version }}

      - name: Build sdist and wheel step
        run: uv build

      # Branch-suffixed so the publisher's branch matrix can build both
      # branches in one run without colliding on the artifact name. The
      # publish-pypi job downloads `pypilibrary-build-<branch>`.
      - name: Upload build artifacts step
        id: artifact-upload-step
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: pypilibrary-build-${{ inputs.branch }}
          path: PyPiLibrary/dist/*
