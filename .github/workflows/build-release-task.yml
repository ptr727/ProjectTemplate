name: Build project release task

on:
  workflow_call:
    inputs:
      # Input to control whether to create a GitHub release
      github:
        required: false
        type: boolean
        default: false
      # Input to control whether to push the library to NuGet.org
      nuget:
        required: false
        type: boolean
        default: false
      # Input to control whether to push the docker image to Docker Hub
      dockerhub:
        required: false
        type: boolean
        default: false

jobs:

  get-version:
    name: Get version information job
    uses: ./.github/workflows/get-version-task.yml
    secrets: inherit

  build-nugetlibrary:
    name: Build NuGet library job
    uses: ./.github/workflows/build-nugetlibrary-task.yml
    secrets: inherit
    with:
      # Conditional push to NuGet.org
      push: ${{ inputs.nuget }}

  # PyPI publishing happens in `publish-release.yml`, not here, so that
  # `id-token: write` only needs to be granted at the entry-point job.
  # This reusable workflow just builds and uploads the artifact; the
  # publish-release workflow downloads it by name in a sibling job.
  build-pypilibrary:
    name: Build PyPI library job
    uses: ./.github/workflows/build-pypilibrary-task.yml
    secrets: inherit

  build-executable:
    name: Build executable job
    uses: ./.github/workflows/build-executable-task.yml
    secrets: inherit

  build-docker:
    name: Build Docker job
    uses: ./.github/workflows/build-docker-task.yml
    secrets: inherit
    with:
      # Conditional push to Docker Hub
      push: ${{ inputs.dockerhub }}

  github-release:
    name: Publish GitHub release job
    if: ${{ inputs.github }}
    runs-on: ubuntu-latest
    needs: [get-version, build-nugetlibrary, build-pypilibrary, build-executable, build-docker]

    steps:

      - name: Checkout code step
        uses: actions/checkout@v6

      - name: Download NuGet library build artifacts step
        uses: actions/download-artifact@v7
        with:
          artifact-ids: ${{ needs.build-nugetlibrary.outputs.artifact-id }}
          path: ./Publish

      - name: Download executable build artifacts step
        uses: actions/download-artifact@v7
        with:
          artifact-ids: ${{ needs.build-executable.outputs.artifact-id }}
          path: ./Publish

      # `target_commitish` MUST be set explicitly: softprops doesn't pass a
      # default through, and GitHub's REST API then defaults the new tag to
      # the repository's default branch (main). On `push: develop` runs the
      # tag would land on main's tip instead of the develop commit that
      # built the artifact, leaving "Browse files" and `git checkout <tag>`
      # pointing at unrelated code.
      - name: Create GitHub release step
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          generate_release_notes: true
          tag_name: ${{ needs.get-version.outputs.SemVer2 }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ github.ref_name != 'main' }}
          files: |
            LICENSE
            README.md
            ./Publish/*
