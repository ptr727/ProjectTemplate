name: Merge bot task

# The fleet merge-bot, hosted here once and reached by every repo through a thin pull_request_target caller pinned to a hub commit.
# Auto-merges in-repo bot PRs (Dependabot, the App's codegen and version-bump PRs): enable on opened/reopened, disable on a maintainer push.
# Watches an armed PR until it merges, since GitHub can disable auto-merge with every check green and gh pr merge --auto only arms it.
# Deletes the head on closed when the caller sets delete-branch to true.
# - Merge method by base: develop = squash, main = merge, since each base's ruleset allows only that form.
# - App token, not GITHUB_TOKEN: fires downstream workflows on merge, and grants write on read-only Dependabot PRs.
#   Every write uses the App token, so no job here declares a GITHUB_TOKEN scope and the caller grants none.
# - The caller triggers on pull_request_target, so the workflow and action SHAs resolve from the trusted base rather than the PR head.
#   This is safe because no job checks out PR code, and each one calls gh or pushes from an empty scratch repo.
# - The github context in a called workflow is the caller's, so github.event.pull_request is the caller's pull_request_target payload.
# - Concurrency lives in the caller, keyed on the PR number with cancel-in-progress false, so no group is declared here.
# - Hyphenated inputs read with dot notation, such as inputs.app-login, as steps.app-token.outputs.token already does.
#   A property name may start with a letter or `_` and continue with letters, digits, `-`, and `_`, so these names need no index syntax.
on:
  workflow_call:
    inputs:
      app-login:
        description: Login of the App that opens codegen and version-bump pull requests.
        required: false
        type: string
        default: ptr727-codegen[bot]
      rules:
        description: >-
          JSON array of extra App pull request rules, appended to the built-in codegen and upstream-version pairs.
          Each rule is {"head": "<exact head ref>"} or {"head-prefix": "<head ref prefix>"} plus {"base": "<base ref>"}.
          The merge method follows the base, so a rule carries none.
        required: false
        type: string
        default: '[]'
      delete-branch:
        description: Delete the bot head branch after its pull request merges, for a repo that keeps the repository-wide auto-delete off and still wants bot branches gone.
        required: false
        type: boolean
        default: false
    secrets:
      CODEGEN_APP_CLIENT_ID:
        required: true
      CODEGEN_APP_PRIVATE_KEY:
        required: true

# One mapping from base to merge method for every job that arms auto-merge, empty for a base no ruleset here covers.
env:
  MERGE_METHOD: ${{ github.event.pull_request.base.ref == 'develop' && '--squash' || github.event.pull_request.base.ref == 'main' && '--merge' || '' }}

jobs:

  merge-dependabot:
    name: Merge dependabot pull request job
    runs-on: ubuntu-latest
    # Dependabot PRs from this repo rather than from forks.
    # Only on opened or reopened, so the disable job stays sticky.
    if: >-
      (github.event.action == 'opened' || github.event.action == 'reopened') &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    outputs:
      armed: ${{ steps.merge.outputs.armed }}

    steps:

      - name: Generate GitHub App token step
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.CODEGEN_APP_CLIENT_ID }}
          private-key: ${{ secrets.CODEGEN_APP_PRIVATE_KEY }}

      # Auto-merge every tier, semver-major included: the required checks are the gate, not the bump magnitude.
      - name: Merge pull request step
        id: merge
        run: |
          set -Eeuo pipefail
          if [[ -z "$MERGE_METHOD" ]]; then
            echo "::error::Unsupported base branch: $BASE_REF"
            exit 1
          fi
          gh pr merge --auto "$MERGE_METHOD" "$PR_URL"
          echo "armed=true" >>"$GITHUB_OUTPUT"
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

  merge-app:
    name: Merge App pull request job
    runs-on: ubuntu-latest
    # App PRs from this repo, on opened or reopened so the disable job stays sticky.
    # Which head and base pairs merge is data: the built-in codegen and upstream-version pairs plus the caller's rules.
    if: >-
      (github.event.action == 'opened' || github.event.action == 'reopened') &&
      github.event.pull_request.user.login == inputs.app-login &&
      github.event.pull_request.head.repo.full_name == github.repository
    outputs:
      armed: ${{ steps.merge.outputs.armed }}

    steps:

      # Validate the rules input at entry and resolve the match once, so a malformed rule fails naming itself rather than as a silent non-merge.
      # An App PR matching no rule is annotated rather than skipped silently, so a renamed tracker branch is visible.
      - name: Resolve merge rule step
        id: rule
        run: |
          set -Eeuo pipefail
          if ! jq -e 'type == "array" and all(.[]; type == "object" and (.base | type) == "string" and ((.head | type) == "string" or (."head-prefix" | type) == "string"))' <<<"$RULES" >/dev/null 2>&1; then
            echo "::error::inputs.rules is not a JSON array of {head|head-prefix, base} objects: $RULES"
            exit 1
          fi
          builtin='[
            {"head": "codegen-main", "base": "main"},
            {"head": "codegen-develop", "base": "develop"},
            {"head": "upstream-version-main", "base": "main"},
            {"head": "upstream-version-develop", "base": "develop"}
          ]'
          # The no-auto-merge- marker is reserved ahead of every rule, built-in or caller-supplied, so a caller's own head-prefix can never match an opted-out head.
          matched=$(jq -r --argjson extra "$RULES" --arg head "$HEAD_REF" --arg base "$BASE_REF" '
            if $head | startswith("no-auto-merge-") then false else
              . + $extra
              | map(select(.base == $base)
                    | select((.head // "") == $head or ((."head-prefix" // "") as $p | $p != "" and ($head | startswith($p)))))
              | length > 0
            end' <<<"$builtin")
          if [[ "$HEAD_REF" == no-auto-merge-* ]]; then
            echo "::warning::App pull request $HEAD_REF -> $BASE_REF carries the no-auto-merge- marker, not auto-merging"
          elif [[ "$matched" != "true" ]]; then
            echo "::warning::App pull request $HEAD_REF -> $BASE_REF matches no merge rule, not auto-merging"
          fi
          echo "matched=$matched" >>"$GITHUB_OUTPUT"
        env:
          RULES: ${{ inputs.rules }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}

      - name: Generate GitHub App token step
        if: ${{ steps.rule.outputs.matched == 'true' }}
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.CODEGEN_APP_CLIENT_ID }}
          private-key: ${{ secrets.CODEGEN_APP_PRIVATE_KEY }}

      - name: Merge pull request step
        if: ${{ steps.rule.outputs.matched == 'true' }}
        id: merge
        run: |
          set -Eeuo pipefail
          if [[ -z "$MERGE_METHOD" ]]; then
            echo "::error::Unsupported base branch: $BASE_REF"
            exit 1
          fi
          gh pr merge --auto "$MERGE_METHOD" "$PR_URL"
          echo "armed=true" >>"$GITHUB_OUTPUT"
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

  watch-auto-merge:
    name: Watch auto-merge job
    runs-on: ubuntu-latest
    needs: [merge-dependabot, merge-app]
    # Runs after this run armed auto-merge, or after the bot's own push, since a bot rebase ends an earlier watch.
    # A merge GitHub refuses, such as one writing workflow content the App may not write, disables auto-merge with every check green.
    # That disable is re-armed once the base settles, and a second one, or a window ending with no merge, fails this job.
    # The watch holds the caller's per-PR concurrency group, so it ends on any head push and the queued run for that push takes over.
    if: >-
      !cancelled() &&
      (
        needs.merge-dependabot.outputs.armed == 'true' ||
        needs.merge-app.outputs.armed == 'true' ||
        (
          github.event.action == 'synchronize' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          (
            github.event.pull_request.user.login == 'dependabot[bot]' ||
            github.event.pull_request.user.login == inputs.app-login
          ) &&
          github.actor == github.event.pull_request.user.login
        )
      )
    # Past the 30-minute watch window, and inside the App token's one-hour life.
    timeout-minutes: 40

    steps:

      - name: Generate GitHub App token step
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.CODEGEN_APP_CLIENT_ID }}
          private-key: ${{ secrets.CODEGEN_APP_PRIVATE_KEY }}

      - name: Watch auto-merge step
        run: |
          set -Eeuo pipefail
          # shellcheck disable=SC2016 # GraphQL variables, expanded by the API rather than the shell
          query='query($owner: String!, $name: String!, $number: Int!) {
            repository(owner: $owner, name: $name) {
              pullRequest(number: $number) {
                state
                headRefOid
                baseRef { target { oid } }
                autoMergeRequest { enabledAt }
                timelineItems(last: 1, itemTypes: [AUTO_MERGE_DISABLED_EVENT]) {
                  nodes { ... on AutoMergeDisabledEvent { createdAt reason reasonCode disabler { login } } }
                }
              }
            }
          }'
          # A read retries, so one transient API error does not fail a watch that has seen nothing wrong.
          read_pr() {
            local attempt out
            for attempt in 1 2 3; do
              if out=$(gh api graphql -f query="$query" -f owner="${REPO%%/*}" -f name="${REPO#*/}" -F number="$NUMBER" --jq .data.repository.pullRequest); then
                pr=$out
                return 0
              fi
              echo "::warning::Reading the pull request failed on attempt $attempt"
              sleep "$POLL_SECONDS"
            done
            echo "::error::Reading the pull request failed three times, so auto-merge is unwatched"
            exit 1
          }
          arm() {
            if [[ -z "$MERGE_METHOD" ]]; then
              echo "::error::Unsupported base branch: $BASE_REF"
              exit 1
            fi
            if ! gh pr merge --auto "$MERGE_METHOD" "$PR_URL"; then
              echo "::error::Re-arming auto-merge failed after GitHub disabled it: $reason"
              exit 1
            fi
          }
          # Siblings merging into the same base are what moves it, so re-arming waits for a quiet window rather than racing them.
          settle_base() {
            local last now quiet_since
            last=$(jq -r '.baseRef.target.oid // ""' <<<"$pr")
            quiet_since=$SECONDS
            while ((SECONDS - quiet_since < SETTLE_SECONDS)); do
              if ((SECONDS >= deadline)); then
                echo "::error::The base branch did not settle within the watch window, so auto-merge stays disabled: $reason"
                exit 1
              fi
              sleep "$POLL_SECONDS"
              read_pr
              now=$(jq -r '.baseRef.target.oid // ""' <<<"$pr")
              if [[ "$now" != "$last" ]]; then
                last=$now
                quiet_since=$SECONDS
              fi
            done
          }

          deadline=$((SECONDS + WATCH_MINUTES * 60))
          rearmed=false
          handled=""
          reason=""
          read_pr
          # A disable the App is recorded for stays this run's to re-arm, since the watch that saw it ended when this push moved the head.
          if [[ "$EVENT_ACTION" == synchronize && $(jq -r --arg app "$APP_LOGIN" '.autoMergeRequest == null and (.timelineItems.nodes[0].disabler.login // "") != $app' <<<"$pr") == true ]]; then
            echo "Auto-merge is not armed on this head, so there is nothing to watch"
            exit 0
          fi
          while true; do
            case $(jq -r .state <<<"$pr") in
              MERGED)
                echo "Merged"
                exit 0
                ;;
              CLOSED)
                echo "::notice::Closed without merging, so the watch ends"
                exit 0
                ;;
            esac
            # The disable already re-armed can still read as current just after the re-arm, so only a newer one counts.
            disabled=$(jq -r --arg handled "$handled" '.autoMergeRequest == null and ($handled == "" or (.timelineItems.nodes[0].createdAt // "") != $handled)' <<<"$pr")
            disabler=$(jq -r '.timelineItems.nodes[0].disabler.login // ""' <<<"$pr")
            reason=$(jq -r '.timelineItems.nodes[0] | "\(.reason // "no reason given") (\(.reasonCode // "no reason code"))"' <<<"$pr")
            if [[ $(jq -r .headRefOid <<<"$pr") != "$HEAD_SHA" ]]; then
              echo "::notice::The head moved past $HEAD_SHA, so the run for that push takes over"
              exit 0
            fi
            if [[ "$disabled" == true ]]; then
              # An unreadable disable fails rather than passing as someone else's, which would hide the stall this job exists to show.
              if [[ -z "$disabler" ]]; then
                echo "::error::Auto-merge was disabled and the disable event could not be read"
                exit 1
              fi
              # GitHub records the App that armed auto-merge as the disabler of a refused merge, so any other disabler is a person's choice.
              if [[ "$disabler" != "$APP_LOGIN" ]]; then
                echo "::warning::$disabler disabled auto-merge, so it stays off: $reason"
                exit 0
              fi
              if [[ "$rearmed" == true ]]; then
                echo "::error::GitHub disabled auto-merge again after the re-arm: $reason"
                exit 1
              fi
              echo "::warning::GitHub disabled auto-merge, re-arming once the base settles: $reason"
              disabled_at=$(jq -r '.timelineItems.nodes[0].createdAt' <<<"$pr")
              settle_base
              read_pr
              # Anything else that changed during the settle is read by the checks at the top of the loop.
              if [[ $(jq -r --arg head "$HEAD_SHA" '.state == "OPEN" and .headRefOid == $head and .autoMergeRequest == null' <<<"$pr") == true ]]; then
                arm
                rearmed=true
                handled=$disabled_at
              fi
              sleep "$POLL_SECONDS"
              read_pr
              continue
            fi
            if ((SECONDS >= deadline)); then
              echo "::error::No merge within $WATCH_MINUTES minutes of arming auto-merge, so a required check may have failed or still be running"
              exit 1
            fi
            sleep "$POLL_SECONDS"
            read_pr
          done
        env:
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          EVENT_ACTION: ${{ github.event.action }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          APP_LOGIN: ${{ inputs.app-login }}
          WATCH_MINUTES: 30
          SETTLE_SECONDS: 60
          POLL_SECONDS: 20
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

  disable-auto-merge-on-maintainer-push:
    name: Disable auto-merge on maintainer push job
    runs-on: ubuntu-latest
    # Fires when a maintainer pushes to a bot's branch, meaning a synchronize whose actor is not the bot.
    # It disables auto-merge so the maintainer's commits do not merge with the bot's, and the maintainer re-enables it manually.
    # The disable call is idempotent.
    if: >-
      github.event.action == 'synchronize' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (
        github.event.pull_request.user.login == 'dependabot[bot]' ||
        github.event.pull_request.user.login == inputs.app-login
      ) &&
      github.actor != github.event.pull_request.user.login

    steps:

      - name: Generate GitHub App token step
        # App token because a Dependabot PR's GITHUB_TOKEN is read-only regardless of who triggered the event.
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.CODEGEN_APP_CLIENT_ID }}
          private-key: ${{ secrets.CODEGEN_APP_PRIVATE_KEY }}

      - name: Disable auto-merge step
        run: gh pr merge --disable-auto "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

  delete-merged-bot-branch:
    name: Delete merged bot branch job
    runs-on: ubuntu-latest
    # Fires on the closed event of a merged in-repo bot pull request, since --auto merges later on GitHub's side.
    if: >-
      inputs.delete-branch &&
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.ref != 'main' &&
      github.event.pull_request.head.ref != 'develop' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (
        github.event.pull_request.user.login == 'dependabot[bot]' ||
        github.event.pull_request.user.login == inputs.app-login
      )

    steps:

      - name: Generate GitHub App token step
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.CODEGEN_APP_CLIENT_ID }}
          private-key: ${{ secrets.CODEGEN_APP_PRIVATE_KEY }}
          permission-contents: write

      # A lease-guarded push deletes the branch only while its tip still equals the merged head, so a recreated or moved branch survives.
      - name: Delete branch step
        run: |
          set -Eeuo pipefail
          git init --quiet "$RUNNER_TEMP/delete-branch"
          cd "$RUNNER_TEMP/delete-branch"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 --wrap=0)
          echo "::add-mask::$auth"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0="http.https://github.com/.extraheader"
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth"
          if out=$(git push --force-with-lease="refs/heads/$HEAD_REF:$MERGED_SHA" "https://github.com/$REPO.git" ":refs/heads/$HEAD_REF" 2>&1); then
            echo "Deleted branch $HEAD_REF at $MERGED_SHA"
          elif grep -Fq 'stale info' <<<"$out"; then
            echo "::notice::Branch $HEAD_REF moved or is already gone, not deleting"
          else
            echo "::error::Deleting branch $HEAD_REF failed: $out"
            exit 1
          fi
        env:
          REPO: ${{ github.repository }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          MERGED_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
