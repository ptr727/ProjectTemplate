name: Merge bot task

# The fleet merge-bot, hosted here once and reached by every repo through a thin pull_request_target caller pinned to a hub commit.
# Auto-merges in-repo bot PRs (Dependabot, the App's codegen and version-bump PRs): enable on opened/reopened, disable on a maintainer push.
# Answers auto_merge_disabled on such a PR: re-arms once, or fails, since GitHub can disable auto-merge with every check green.
# Deletes the head on closed when the caller sets delete-branch to true.
# - Merge method by base: develop = squash, main = merge, since each base's ruleset allows only that form.
# - App token, not GITHUB_TOKEN: fires downstream workflows on merge, and grants write on read-only Dependabot PRs.
#   Every write uses the App token, so no job here declares a GITHUB_TOKEN scope and the caller grants none.
# - The caller triggers on pull_request_target, so the workflow and action SHAs resolve from the trusted base rather than the PR head.
#   This is safe because no job checks out PR code, and each one calls gh or pushes from an empty scratch repo.
# - The github context in a called workflow is the caller's, so github.event.pull_request is the caller's pull_request_target payload.
# - Concurrency lives in the caller, keyed on the PR number with cancel-in-progress false, so no group is declared here.
# - Hyphenated inputs read with dot notation, such as inputs.app-login, as steps.app-token.outputs.token already does.
#   A property name may start with a letter or `_` and continue with letters, digits, `-`, and `_`, so these names need no index syntax.
on:
  workflow_call:
    inputs:
      app-login:
        description: Login of the App that opens codegen and version-bump pull requests.
        required: false
        type: string
        default: ptr727-codegen[bot]
      rules:
        description: >-
          JSON array of extra App pull request rules, appended to the built-in codegen and upstream-version pairs.
          Each rule is {"head": "<exact head ref>"} or {"head-prefix": "<head ref prefix>"} plus {"base": "<base ref>"}.
          The merge method follows the base, so a rule carries none.
        required: false
        type: string
        default: '[]'
      delete-branch:
        description: Delete the bot head branch after its pull request merges, for a repo that keeps the repository-wide auto-delete off and still wants bot branches gone.
        required: false
        type: boolean
        default: false
    secrets:
      CODEGEN_APP_CLIENT_ID:
        required: true
      CODEGEN_APP_PRIVATE_KEY:
        required: true

# One mapping from base to merge method for every job that arms auto-merge, empty for a base no ruleset here covers.
env:
  MERGE_METHOD: ${{ github.event.pull_request.base.ref == 'develop' && '--squash' || github.event.pull_request.base.ref == 'main' && '--merge' || '' }}

jobs:

  merge-dependabot:
    name: Merge dependabot pull request job
    runs-on: ubuntu-latest
    # Dependabot PRs from this repo rather than from forks.
    # Only on opened or reopened, so the disable job stays sticky.
    if: >-
      (github.event.action == 'opened' || github.event.action == 'reopened') &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    # The check wait below is bounded well inside this.
    timeout-minutes: 25

    steps:

      - name: Generate GitHub App token step
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ secrets.CODEGEN_APP_CLIENT_ID }}
          private-key: ${{ secrets.CODEGEN_APP_PRIVATE_KEY }}

      # Auto-merge every tier, semver-major included: the required checks are the gate, not the bump magnitude.
      # The merge-app job aliases this step's script and env, so both jobs run one step.
      - name: Merge pull request step
        run: &merge-run |
          set -Eeuo pipefail
          if [[ -z "$MERGE_METHOD" ]]; then
            echo "::error::Unsupported base branch: $BASE_REF"
            exit 1
          fi
          # A read retries, so one transient API error does not fail the merge.
          # A read the App token may not make fails at once, naming the permission its installation has not accepted.
          read_api() {
            local what=$1 permission=$2 attempt err
            shift 2
            err=$(mktemp)
            for attempt in 1 2 3; do
              if out=$("$@" 2>"$err"); then
                return 0
              fi
              cat "$err" >&2
              if [[ -n "$permission" ]] && grep -Fq 'Resource not accessible by integration' "$err"; then
                echo "::error::Reading $what was refused, so an App installation has not accepted the $permission permission yet"
                exit 1
              fi
              echo "::warning::Reading $what failed on attempt $attempt"
              sleep "$POLL_SECONDS"
            done
            echo "::error::Reading $what failed three times, so the pull request is not merged"
            exit 1
          }

          read_api "the base branch rules" "" gh api --paginate "repos/$REPO/rules/branches/$BASE_REF" --jq '.[].type'
          if grep -Fxq required_status_checks <<<"$out"; then
            gh pr merge --auto "$MERGE_METHOD" --match-head-commit "$HEAD_SHA" "$PR_URL"
            exit 0
          fi

          # GitHub arms auto-merge only on a base with required checks, so here the step waits for the head's checks and merges itself, per D8.1.
          echo "The $BASE_REF rules require no status checks, so the merge waits for every check on $HEAD_SHA"
          deadline=$((SECONDS + WAIT_LIMIT_SECONDS))
          passing=""
          passing_since=0
          while :; do
            read_api "the pull request" "" gh api "repos/$REPO/pulls/$NUMBER" --jq '[.state, (.merged | tostring), .head.sha] | @tsv'
            IFS=$'\t' read -r state merged head <<<"$out"
            if [[ "$merged" == true ]]; then
              echo "The pull request is already merged, so there is nothing to merge"
              exit 0
            fi
            if [[ "$state" != open ]]; then
              echo "::notice::The pull request was closed, so it is not merged"
              exit 0
            fi
            if [[ "$head" != "$HEAD_SHA" ]]; then
              echo "::error::The head moved from $HEAD_SHA to $head, so the pull request is not merged"
              exit 1
            fi
            read_api "the head's check runs" "checks: read" gh api --paginate "repos/$REPO/commits/$HEAD_SHA/check-runs?per_page=100" --jq '.check_runs[] | {name, status, conclusion}'
            runs=$out
            read_api "the head's commit statuses" "statuses: read" gh api --paginate "repos/$REPO/commits/$HEAD_SHA/status?per_page=100" --jq '.statuses[] | {name: .context, status: (if .state == "pending" then "pending" else "completed" end), conclusion: .state}'
            # This workflow's own jobs post on the head too, as a caller job name, a slash, and the job name, so the wait leaves them out.
            checks=$(jq -sc --argjson own "$OWN_JOBS" '
              map(select(.name as $n | $own | any(. as $j | $n == $j or ($n | endswith(" / " + $j))) | not))
              | sort_by(.name)' <<<"$runs"$'\n'"$out")
            failed=$(jq -r '[.[] | select(.status == "completed" and (.conclusion | IN("success", "neutral", "skipped") | not))
              | "\(.name) (\(.conclusion))"] | join(", ")' <<<"$checks")
            if [[ -n "$failed" ]]; then
              echo "::error::A check on the head failed, so the pull request is not merged: $failed"
              exit 1
            fi
            if [[ $(jq -r 'all(.status == "completed")' <<<"$checks") == true ]]; then
              # A check that has not posted yet reads as absent, so the passing set has to hold for the settle window.
              if [[ "$checks" != "$passing" ]]; then
                passing=$checks
                passing_since=$SECONDS
              fi
              if ((SECONDS - passing_since >= SETTLE_SECONDS)); then
                break
              fi
            else
              passing=""
            fi
            if ((SECONDS >= deadline)); then
              pending=$(jq -r '[.[] | select(.status != "completed") | .name] | join(", ")' <<<"$checks")
              echo "::error::The head's checks did not all pass and settle within $WAIT_LIMIT_SECONDS seconds, so the pull request is not merged: ${pending:-none pending}"
              exit 1
            fi
            sleep "$POLL_SECONDS"
          done
          # The head pin keeps a push landing after the last read from being merged in the bot's place.
          gh pr merge "$MERGE_METHOD" --match-head-commit "$HEAD_SHA" "$PR_URL"
        env: &merge-env
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          OWN_JOBS: >-
            ["Merge dependabot pull request job", "Merge App pull request job", "Re-arm auto-merge job",
            "Disable auto-merge on maintainer push job", "Delete merged bot branch job"]
          WAIT_LIMIT_SECONDS: 1200
          SETTLE_SECONDS: 60
          POLL_SECONDS: 15
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

  merge-app:
    name: Merge App pull request job
    runs-on: ubuntu-latest
    # App PRs from this repo, arming on opened or reopened so the disable job stays sticky.
    # On auto_merge_disabled it only resolves the rule, so the re-arm job never arms a head the rules leave unmerged.
    # Which head and base pairs merge is data: the built-in codegen and upstream-version pairs plus the caller's rules.
    if: >-
      (
        github.event.action == 'opened' ||
        github.event.action == 'reopened' ||
        (github.event.action == 'auto_merge_disabled' && github.event.pull_request.state == 'open')
      ) &&
      github.event.pull_request.user.login == inputs.app-login &&
      github.event.pull_request.head.repo.full_name == github.repository
    # The check wait in the merge step is bounded well inside this.
    timeout-minutes: 25
    outputs:
      matched: ${{ steps.rule.outputs.matched }}

    steps:

      # Validate the rules input at entry and resolve the match once, so a malformed rule fails naming itself rather than as a silent non-merge.
      # An App PR matching no rule is annotated rather than skipped silently, so a renamed tracker branch is visible.
      - name: Resolve merge rule step
        id: rule
        run: |
          set -Eeuo pipefail
          if ! jq -e 'type == "array" and all(.[]; type == "object" and (.base | type) == "string" and ((.head | type) == "string" or (."head-prefix" | type) == "string"))' <<<"$RULES" >/dev/null 2>&1; then
            echo "::error::inputs.rules is not a JSON array of {head|head-prefix, base} objects: $RULES"
            exit 1
          fi
          builtin='[
            {"head": "codegen-main", "base": "main"},
            {"head": "codegen-develop", "base": "develop"},
            {"head": "upstream-version-main", "base": "main"},
            {"head": "upstream-version-develop", "base": "develop"}
          ]'
          # The no-auto-merge- marker is reserved ahead of every rule, built-in or caller-supplied, so a caller's own head-prefix can never match an opted-out head.
          matched=$(jq -r --argjson extra "$RULES" --arg head "$HEAD_REF" --arg base "$BASE_REF" '
            if $head | startswith("no-auto-merge-") then false else
              . + $extra
              | map(select(.base == $base)
                    | select((.head // "") == $head or ((."head-prefix" // "") as $p | $p != "" and ($head | startswith($p)))))
              | length > 0
            end' <<<"$builtin")
          if [[ "$EVENT_ACTION" == auto_merge_disabled ]]; then
            :
          elif [[ "$HEAD_REF" == no-auto-merge-* ]]; then
            echo "::warning::App pull request $HEAD_REF -> $BASE_REF carries the no-auto-merge- marker, not auto-merging"
          elif [[ "$matched" != "true" ]]; then
            echo "::warning::App pull request $HEAD_REF -> $BASE_REF matches no merge rule, not auto-merging"
          fi
          echo "matched=$matched" >>"$GITHUB_OUTPUT"
        env:
          EVENT_ACTION: ${{ github.event.action }}
          RULES: ${{ inputs.rules }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}

      - name: Generate GitHub App token step
        if: ${{ steps.rule.outputs.matched == 'true' && github.event.action != 'auto_merge_disabled' }}
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ secrets.CODEGEN_APP_CLIENT_ID }}
          private-key: ${{ secrets.CODEGEN_APP_PRIVATE_KEY }}

      - name: Merge App pull request step
        if: ${{ steps.rule.outputs.matched == 'true' && github.event.action != 'auto_merge_disabled' }}
        run: *merge-run
        env: *merge-env

  rearm-auto-merge:
    name: Re-arm auto-merge job
    runs-on: ubuntu-latest
    needs: [merge-app]
    # GitHub can disable auto-merge with every check green, as for a merge writing workflow content the App may not write.
    # Since gh pr merge --auto only arms the merge, this job answers the caller's auto_merge_disabled event: it re-arms once, or fails.
    # Runs only for a PR the merge jobs would arm: any in-repo Dependabot PR, or an App PR whose head matches a merge rule.
    if: >-
      !cancelled() &&
      (needs.merge-app.result == 'success' || needs.merge-app.result == 'skipped') &&
      github.event.action == 'auto_merge_disabled' &&
      github.event.pull_request.state == 'open' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (
        github.event.pull_request.user.login == 'dependabot[bot]' ||
        needs.merge-app.outputs.matched == 'true'
      )
    # The settle wait below is bounded well inside this.
    timeout-minutes: 10

    steps:

      - name: Generate GitHub App token step
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ secrets.CODEGEN_APP_CLIENT_ID }}
          private-key: ${{ secrets.CODEGEN_APP_PRIVATE_KEY }}

      - name: Re-arm auto-merge step
        run: |
          set -Eeuo pipefail
          # shellcheck disable=SC2016 # GraphQL variables, expanded by the API rather than the shell
          query='query($owner: String!, $name: String!, $number: Int!) {
            repository(owner: $owner, name: $name) {
              pullRequest(number: $number) {
                state
                headRefOid
                baseRef { target { oid } }
                autoMergeRequest { enabledAt }
                headRef { target { ... on Commit { committedDate } } }
                timelineItems(last: 20, itemTypes: [AUTO_MERGE_DISABLED_EVENT]) {
                  nodes { ... on AutoMergeDisabledEvent { createdAt reason reasonCode disabler { login } } }
                }
              }
            }
          }'
          # A read retries, so one transient API error does not fail a run that has seen nothing wrong.
          read_api() {
            local what=$1 attempt
            shift
            for attempt in 1 2 3; do
              if out=$("$@"); then
                return 0
              fi
              echo "::warning::Reading $what failed on attempt $attempt"
              sleep "$POLL_SECONDS"
            done
            echo "::error::Reading $what failed three times, so the disable is unanswered"
            exit 1
          }
          read_pr() {
            read_api "the pull request" gh api graphql -f query="$query" -f owner="${REPO%%/*}" -f name="${REPO#*/}" -F number="$NUMBER" --jq .data.repository.pullRequest
            pr=$out
          }
          # Read again before acting, since a close, an arming, or a push can land while the settle waits.
          check_pr() {
            if [[ $(jq -r .state <<<"$pr") != OPEN ]]; then
              echo "The pull request is no longer open, so there is nothing to re-arm"
              exit 0
            fi
            if [[ $(jq -r '.autoMergeRequest != null' <<<"$pr") == true ]]; then
              echo "Auto-merge is armed again, so there is nothing to re-arm"
              exit 0
            fi
            disabler=$(jq -r '.timelineItems.nodes[-1].disabler.login // ""' <<<"$pr")
            reason=$(jq -r '.timelineItems.nodes[-1] | "\(.reason // "no reason given") (\(.reasonCode // "no reason code"))"' <<<"$pr")
            # An unreadable disable fails rather than passing as someone else's, which would hide the stall this job exists to show.
            if [[ -z "$disabler" ]]; then
              echo "::error::Auto-merge was disabled and the disable event could not be read"
              exit 1
            fi
            # GitHub records the App that armed auto-merge as the disabler of a refused merge, so any other disabler is a person's choice.
            if [[ "$disabler" != "$APP_BOT" ]]; then
              echo "::notice::$disabler disabled auto-merge, so it stays off: $reason"
              exit 0
            fi
            # The maintainer-push job also disables under the App, so the push that made the head has to be the bot's own.
            # The branch activity names the pusher of a fast-forward and a force push alike, where a cherry-pick or a rebase keeps the bot as author.
            local head pusher
            head=$(jq -r .headRefOid <<<"$pr")
            read_api "the head branch activity" gh api -X GET "repos/$REPO/activity" -f ref="refs/heads/$HEAD_REF" -F per_page=30
            pusher=$(jq -r --arg head "$head" 'first(.[] | select(.after == $head) | .actor.login // "") // ""' <<<"$out")
            # A head with no recorded push fails rather than passing as a person's, for the same reason as an unreadable disable.
            if [[ -z "$pusher" ]]; then
              echo "::error::No push of the head is recorded, so the disable is unanswered: $reason"
              exit 1
            fi
            if [[ "$pusher" != "$PR_AUTHOR" ]]; then
              echo "::notice::$pusher pushed the head rather than the bot, so auto-merge stays off: $reason"
              exit 0
            fi
          }
          # Siblings merging into the same base are what moves it, so the re-arm waits for a quiet window rather than racing them.
          settle_base() {
            local last now quiet_since
            last=$(jq -r '.baseRef.target.oid // ""' <<<"$pr")
            quiet_since=$SECONDS
            while ((SECONDS - quiet_since < SETTLE_SECONDS)); do
              if ((SECONDS >= deadline)); then
                echo "::error::The base branch kept moving for $SETTLE_LIMIT_SECONDS seconds, so auto-merge stays disabled: $reason"
                exit 1
              fi
              sleep "$POLL_SECONDS"
              read_pr
              check_pr
              now=$(jq -r '.baseRef.target.oid // ""' <<<"$pr")
              if [[ "$now" != "$last" ]]; then
                last=$now
                quiet_since=$SECONDS
              fi
            done
          }

          deadline=$((SECONDS + SETTLE_LIMIT_SECONDS))
          read_pr
          check_pr
          # Once means one re-arm per head, so a second App-recorded disable since the head's commit is the one this job does not answer.
          disables=$(jq -r --arg app "$APP_BOT" '.headRef.target.committedDate as $since
            | [.timelineItems.nodes[] | select(.disabler.login == $app and .reasonCode != "closed" and .createdAt > $since)] | length' <<<"$pr")
          if ((disables > 1)); then
            echo "::error::GitHub disabled auto-merge again after the re-arm: $reason"
            exit 1
          fi
          echo "::warning::Auto-merge was disabled under the App, re-arming once the base settles: $reason"
          settle_base
          head=$(jq -r .headRefOid <<<"$pr")
          # Where every check is already green, gh merges at once rather than arming, so a refused merge ends here as a failed job.
          # The head pin keeps a push landing after the last read from being armed or merged in the bot's place.
          if ! gh pr merge --auto "$MERGE_METHOD" --match-head-commit "$head" "$PR_URL"; then
            echo "::error::Re-arming auto-merge, or merging at once where every check is green, failed: $reason"
            exit 1
          fi
        env:
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          # The App that minted the arming token, which a caller's app-login input need not name.
          APP_BOT: ${{ steps.app-token.outputs.app-slug }}[bot]
          SETTLE_SECONDS: 60
          SETTLE_LIMIT_SECONDS: 300
          POLL_SECONDS: 15
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

  disable-auto-merge-on-maintainer-push:
    name: Disable auto-merge on maintainer push job
    runs-on: ubuntu-latest
    # Fires when a maintainer pushes to a bot's branch, meaning a synchronize whose actor is not the bot.
    # It disables auto-merge so the maintainer's commits do not merge with the bot's, and the maintainer re-enables it manually.
    # The disable call is idempotent.
    if: >-
      github.event.action == 'synchronize' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (
        github.event.pull_request.user.login == 'dependabot[bot]' ||
        github.event.pull_request.user.login == inputs.app-login
      ) &&
      github.actor != github.event.pull_request.user.login

    steps:

      - name: Generate GitHub App token step
        # App token because a Dependabot PR's GITHUB_TOKEN is read-only regardless of who triggered the event.
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ secrets.CODEGEN_APP_CLIENT_ID }}
          private-key: ${{ secrets.CODEGEN_APP_PRIVATE_KEY }}

      - name: Disable auto-merge step
        run: gh pr merge --disable-auto "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

  delete-merged-bot-branch:
    name: Delete merged bot branch job
    runs-on: ubuntu-latest
    # Fires on the closed event of a merged in-repo bot pull request, since --auto merges later on GitHub's side.
    if: >-
      inputs.delete-branch &&
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.ref != 'main' &&
      github.event.pull_request.head.ref != 'develop' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (
        github.event.pull_request.user.login == 'dependabot[bot]' ||
        github.event.pull_request.user.login == inputs.app-login
      )

    steps:

      - name: Generate GitHub App token step
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ secrets.CODEGEN_APP_CLIENT_ID }}
          private-key: ${{ secrets.CODEGEN_APP_PRIVATE_KEY }}
          permission-contents: write

      # A lease-guarded push deletes the branch only while its tip still equals the merged head, so a recreated or moved branch survives.
      - name: Delete branch step
        run: |
          set -Eeuo pipefail
          git init --quiet "$RUNNER_TEMP/delete-branch"
          cd "$RUNNER_TEMP/delete-branch"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 --wrap=0)
          echo "::add-mask::$auth"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0="http.https://github.com/.extraheader"
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth"
          if out=$(git push --force-with-lease="refs/heads/$HEAD_REF:$MERGED_SHA" "https://github.com/$REPO.git" ":refs/heads/$HEAD_REF" 2>&1); then
            echo "Deleted branch $HEAD_REF at $MERGED_SHA"
          elif grep -Fq 'stale info' <<<"$out"; then
            echo "::notice::Branch $HEAD_REF moved or is already gone, not deleting"
          else
            echo "::error::Deleting branch $HEAD_REF failed: $out"
            exit 1
          fi
        env:
          REPO: ${{ github.repository }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          MERGED_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
