name: Publish project release action

on:
  push:
    branches: [ main, develop ]
  workflow_dispatch:
  schedule:
    # Weekly full build/publish of both branches. Routine merges only smoke-test; this scheduled run republishes
    # everything (also refreshing the Docker base image).
    - cron: '0 2 * * MON'

# Real publishes share one global group so they serialize: they push both branches' shared Docker tags/caches and
# releases regardless of ref, so a ref-scoped group could double-push. Non-publishing push runs get a unique per-run
# group so they don't queue behind a real publish.
concurrency:
  group: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || vars.PUBLISH_ON_MERGE == 'true') && github.workflow || format('{0}-noop-{1}', github.workflow, github.run_id) }}
  # Queue instead of cancel: cancelling a publish mid-flight can leave a partially pushed multi-arch tag set or a
  # half-created GitHub release.
  cancel-in-progress: false

jobs:

  # Decide which branches to publish and whether to publish at all: push -> only the pushed branch, and only when the
  # PUBLISH_ON_MERGE variable is true (default two-phase model: merges don't publish); schedule/dispatch -> both
  # branches.
  setup:
    name: Resolve publish plan job
    runs-on: ubuntu-latest
    outputs:
      branches: ${{ steps.plan.outputs.branches }}
      publish: ${{ steps.plan.outputs.publish }}
    steps:
      - name: Compute publish plan step
        id: plan
        env:
          # Repository variable; unset reads as empty string, so the default is the two-phase model.
          PUBLISH_ON_MERGE: ${{ vars.PUBLISH_ON_MERGE }}
        run: |
          set -euo pipefail
          # Schedule/dispatch builds both branches regardless of triggering ref. A dispatch on a non-default ref
          # mis-versions the main leg (NBGV can't resolve the public main ref), so fail fast: dispatch from default only.
          if [[ "${{ github.event_name }}" == "workflow_dispatch" \
                && "${{ github.ref_name }}" != "${{ github.event.repository.default_branch }}" ]]; then
            echo "::error::Dispatch publish-release from the default branch (${{ github.event.repository.default_branch }}); the matrix builds both branches. Re-dispatch on the default branch."
            exit 1
          fi
          case "${{ github.event_name }}" in
            push)
              branches='["${{ github.ref_name }}"]'
              if [[ "${PUBLISH_ON_MERGE:-}" == "true" ]]; then
                publish=true
              else
                publish=false
              fi
              ;;
            *)
              # schedule / workflow_dispatch
              branches='["main","develop"]'
              publish=true
              ;;
          esac
          echo "Event=${{ github.event_name }} branches=$branches publish=$publish"
          echo "branches=$branches" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

  # Full build + publish of every target per planned branch. The matrix lets one run publish main (Release/latest)
  # and develop (Debug/develop) - each leg checks out and versions its own branch via the threaded ref/branch.
  publish:
    name: Publish project release job
    needs: [setup]
    if: ${{ needs.setup.outputs.publish == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        branch: ${{ fromJSON(needs.setup.outputs.branches) }}
    uses: ./.github/workflows/build-release-task.yml
    secrets: inherit
    permissions:
      contents: write
    with:
      ref: ${{ matrix.branch }}
      branch: ${{ matrix.branch }}
      smoke: false
      # Push to GitHub and NuGet and Docker Hub.
      github: true
      nuget: true
      dockerhub: true

  publish-pypi:
    name: Publish PyPI library job
    needs: [setup, publish]
    if: ${{ needs.setup.outputs.publish == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        branch: ${{ fromJSON(needs.setup.outputs.branches) }}
    runs-on: ubuntu-latest
    # build-pypilibrary-task.yml picks the PEP 440 version per branch (M.N.P.B on main, M.N.P.B.dev0 on develop). The
    # pypi environment's deployment branch rule restricts uploads to main + develop as defense in depth.
    environment:
      name: pypi
      url: https://pypi.org/project/ptr727-projecttemplate-library/
    # id-token:write for Trusted Publishing's OIDC exchange, contents:read for repo metadata, actions:read so
    # download-artifact can fetch this run's build artifact.
    permissions:
      id-token: write
      contents: read
      actions: read

    steps:

      - name: Download PyPI library build artifacts step
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          # Branch-suffixed name so both branch legs in this run stay distinct.
          name: pypilibrary-build-${{ matrix.branch }}
          path: ./dist

      - name: Publish to PyPI step
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
        with:
          packages-dir: ./dist
          # Skip rather than fail when the version already exists; the weekly republish re-uploads unchanged versions.
          skip-existing: true

  date-badge:
    name: Create BYOB date badge job
    needs: [setup, publish]
    if: ${{ needs.setup.outputs.publish == 'true' }}
    strategy:
      matrix:
        branch: ${{ fromJSON(needs.setup.outputs.branches) }}
    uses: ./.github/workflows/build-datebadge-task.yml
    secrets: inherit
    permissions:
      contents: write
    with:
      # The badge task self-gates to main; the develop leg is a no-op.
      branch: ${{ matrix.branch }}

  docker-readme:
    name: Publish Docker Hub readme job
    needs: [setup, publish]
    if: ${{ needs.setup.outputs.publish == 'true' }}
    strategy:
      matrix:
        branch: ${{ fromJSON(needs.setup.outputs.branches) }}
    uses: ./.github/workflows/publish-docker-readme-task.yml
    secrets: inherit
    permissions:
      contents: read
    with:
      # The task self-gates to main; the develop leg is a no-op.
      branch: ${{ matrix.branch }}

  # Release artifacts are an intra-run handoff (durable copies live on the GitHub release), so leaving them accumulates
  # against the small account-wide storage quota; delete them once every consumer has read them.
  cleanup-artifacts:
    name: Delete workflow artifacts job
    needs: [setup, publish, publish-pypi, date-badge, docker-readme]
    if: ${{ always() && needs.setup.outputs.publish == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Delete workflow artifacts step
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Best-effort housekeeping: the guards (`|| true`, `|| echo`) tolerate a failed delete so it never reds a
          # successful publish, while `set -e` still catches unexpected failures.
          set -euo pipefail
          if ! ids=$(gh api repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts --paginate \
            --jq '.artifacts[].id'); then
            echo "::warning::Could not list run artifacts; skipping cleanup (storage may not be freed)."
            ids=""
          fi
          for artifact_id in $ids; do
            gh api --method DELETE "repos/${{ github.repository }}/actions/artifacts/$artifact_id" \
              || echo "::warning::Failed to delete artifact $artifact_id; continuing."
          done
