name: Publish project release action

# The hub exercises its own build-release-task.yml on every real publish, with every build target disabled and expect_release_assets set false, producing a tag-only release.
# This proves the task's get-version, validate-release, and github-release jobs run cleanly end to end.
# The hub has no build targets to prove the hook mechanism itself, which falls to the first downstream adopter per docs/reusable-workflows.md "What a Pilot Proves".
on:
  workflow_dispatch:

# A publish is a deliberate dispatch, so runs serialize on one group and queue rather than cancel.
# That leaves no run with a half-created GitHub release.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:

  # Fail fast (D2.3) on a dispatch from anything but main or develop, before validation or the build run.
  assert-dispatch-ref:
    name: Assert dispatch ref job
    runs-on: ubuntu-latest
    steps:
      - name: Assert dispatch ref step
        run: |
          set -Eeuo pipefail
          if [ "${{ github.ref_name }}" != "main" ] && [ "${{ github.ref_name }}" != "develop" ]; then
            echo "::error::Dispatch publish-release from main (release) or develop (prerelease); got ${{ github.ref_name }}."
            exit 1
          fi

  # Single source of the release-gate decision, publish or not and stable or not, reused by validate and publish below.
  # This repo triggers on workflow_dispatch only, so plan's decision is redundant with assert-dispatch-ref in practice.
  # The job stays the uniform shape every publish-release.yml caller stub carries.
  plan:
    name: Plan release job
    needs: [ assert-dispatch-ref ]
    uses: ./.github/workflows/publish-plan-task.yml
    with:
      event_name: ${{ github.event_name }}
      actor: ${{ github.actor }}
      ref_name: ${{ github.ref_name }}

  # The same reusable gate the PR runs - a dispatch cannot release a ref that fails validation.
  validate:
    name: Validate sources job
    needs: [ plan ]
    if: ${{ needs.plan.outputs.publish == 'true' }}
    uses: ./.github/workflows/validate-task.yml
    permissions:
      contents: read

  # Publish the dispatched branch, where main gives a release and develop a prerelease.
  # Pin to the dispatch-time commit so a push landing after dispatch does not release unvalidated.
  publish:
    name: Publish project release job
    needs: [ plan, validate ]
    if: ${{ needs.plan.outputs.publish == 'true' && needs.validate.result == 'success' }}
    uses: ./.github/workflows/build-release-task.yml
    permissions:
      contents: write
      actions: write
    with:
      ref: ${{ github.sha }}
      branch: ${{ github.ref_name }}
      smoke: false
      github: true
      dockerhub: false
      nuget: false
      enable_docker: false
      enable_nuget: false
      enable_pypi: false
      enable_dotnet_publish: false
      # This repo is source-only, so the release is just the tag + source zip + README + LICENSE.
      expect_release_assets: false
