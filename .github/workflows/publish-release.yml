name: Publish project release action

on:
  push:
    branches: [ main, develop ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  create-release:
    name: Publish project release job
    uses: ./.github/workflows/build-release-task.yml
    secrets: inherit
    permissions:
      contents: write
    with:
      # Push to GitHub and NuGet and Docker Hub
      github: true
      nuget: true
      dockerhub: true

  publish-pypi:
    name: Publish PyPI library job
    # Runs on pushes to both `main` and `develop`. `build-pypilibrary-task.yml`
    # picks the PEP 440 version per branch (`M.N.P.B` release on main,
    # `M.N.P.B.dev0` on develop — BuildNumber stays in the release segment
    # so develop's release segment grows past main's per commit). Default
    # `pip install <pkg>` filters `.dev0` and picks the main release;
    # `pip install --pre <pkg>` includes dev releases and picks develop's
    # higher release segment. Matches how NuGet/Docker tag develop builds
    # as prerelease via NBGV `SemVer2`.
    # The `pypi` GitHub environment's Deployment branch rule
    # (Settings → Environments → pypi) restricts uploads to `main` +
    # `develop` as defense in depth — see PyPiLibrary/README.md.
    needs: [create-release]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/ptr727-projecttemplate-library/
    # When a `permissions:` block is present, every scope not listed
    # collapses to `none`. The job needs three things explicitly:
    #   - `id-token: write` for Trusted Publishing's OIDC exchange
    #     (pypa/gh-action-pypi-publish swaps the token for a short-lived
    #     PyPI upload token; no PYPI_API_TOKEN secret involved).
    #   - `contents: read` so `actions/checkout`-style operations and any
    #     repo metadata reads continue to work.
    #   - `actions: read` so `actions/download-artifact` can list and
    #     fetch the artifact uploaded by the build workflow earlier in
    #     the same run.
    permissions:
      id-token: write
      contents: read
      actions: read

    steps:

      - name: Download PyPI library build artifacts step
        uses: actions/download-artifact@v7
        with:
          name: pypilibrary-build
          path: ./dist

      - name: Publish to PyPI step
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
        with:
          packages-dir: ./dist
          # Skip rather than fail when the version already exists on PyPI.
          # The template ships with `__version__ = "0.0.0"` as a placeholder
          # — the release-on-every-push model would otherwise re-upload the
          # same version and fail the workflow until the adopter wires a
          # real version scheme (see PyPiLibrary/README.md).
          skip-existing: true

  date-badge:
    name: Create BYOB date badge job
    needs: [create-release]
    uses: ./.github/workflows/build-datebadge-task.yml
    secrets: inherit
    permissions:
      contents: write
