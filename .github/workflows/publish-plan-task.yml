name: Publish plan task

# Single source of truth for the release-gate decision, hosted here once and reused by every publish-release job.
# The policy therefore lives here rather than scattered across job `if:` conditions.
# A human PR merge never auto-publishes.
# A release is a deliberate dispatch, a bot (Dependabot/codegen) code-merge to main, or the Docker weekly schedule.
#
# Outputs:
#   publish - 'true' when this run should publish, meaning a bot-authored push, a schedule, or a workflow_dispatch of main/develop.
#             The codegen App merges every bot PR, so its identity, or dependabot[bot], is the gate.
#             A human push (a merge/promotion to main) is 'false'.
#   stable  - 'true' when the target branch is main (the stable channel).
#             Main-only jobs gate on publish && stable.
#
# Both outputs are the strings 'true'/'false', so gate with == 'true'.
# A bare `if: ${{ needs.plan.outputs.publish }}` is always truthy, since a non-empty string is truthy in an Actions expression.
#
# Shared across repo types: a library/package repo triggers only push + dispatch and uses `publish`.
# A Docker/wrapper repo also triggers the weekly schedule and gates main-only jobs on `stable`.
# A case a given caller never triggers (e.g. schedule for a library) is simply inert for it.
# That is expected of a single-source task.

on:
  workflow_call:
    inputs:
      event_name:
        description: The triggering event (github.event_name).
        required: true
        type: string
      actor:
        description: The actor that triggered the run (github.actor).
        required: true
        type: string
      ref_name:
        description: The short ref name (github.ref_name).
        required: true
        type: string
    outputs:
      publish:
        description: "'true' when this run should publish."
        value: ${{ jobs.plan.outputs.publish }}
      stable:
        description: "'true' when the target branch is main (stable channel)."
        value: ${{ jobs.plan.outputs.stable }}

jobs:

  plan:
    name: Plan release job
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.decide.outputs.publish }}
      stable: ${{ steps.decide.outputs.stable }}

    steps:

      - name: Decide release plan step
        id: decide
        env:
          EVENT: ${{ inputs.event_name }}
          ACTOR: ${{ inputs.actor }}
          REF: ${{ inputs.ref_name }}
        run: |
          set -Eeuo pipefail
          publish=false
          case "$EVENT" in
            workflow_dispatch)
              if [[ "$REF" != "main" && "$REF" != "develop" ]]; then
                echo "::error::Dispatch a release from main or develop, not '$REF'."
                exit 1
              fi
              publish=true
              ;;
            schedule)
              # Docker weekly refresh (main-only by schedule config).
              publish=true
              ;;
            push)
              # A human merge never auto-publishes, and only a bot merge to main does.
              # The codegen App merges every Dependabot/codegen PR, so github.actor is its identity.
              # The dependabot[bot] identity is allowed defensively alongside it.
              # The ref==main guard keeps the task self-contained even if a caller's push trigger is not main-only.
              if [[ "$REF" == "main" ]] && { [[ "$ACTOR" == "ptr727-codegen[bot]" ]] || [[ "$ACTOR" == "dependabot[bot]" ]]; }; then
                publish=true
              elif [[ "$REF" == "main" ]]; then
                # Fail loud, because an unrecognized actor pushing to main is one of two things.
                # It is either a human commit, legitimately not publishing but worth seeing.
                # Or it is a release bot under a new identity, which would otherwise stop publishing silently.
                # A schedule would keep releasing meanwhile, costing timeliness with no error raised.
                echo "::warning::Push to main by unrecognized actor '$ACTOR'; not publishing. If this is a release bot under a new identity, update the allowlist in publish-plan-task.yml."
              fi
              ;;
          esac
          stable=false
          [[ "$REF" == "main" ]] && stable=true
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "stable=$stable" >> "$GITHUB_OUTPUT"
          echo "Release plan: event=$EVENT actor=$ACTOR ref=$REF -> publish=$publish stable=$stable"
