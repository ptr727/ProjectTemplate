name: Test docker build PRs

on:
  pull_request:
    branches: [ main, develop ]
    paths:
      # Only run on changes to Docker-related files
      - 'Docker/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  test-docker:
    name: Test docker build
    uses: ./.github/workflows/test-docker-task.yml
    secrets: inherit
