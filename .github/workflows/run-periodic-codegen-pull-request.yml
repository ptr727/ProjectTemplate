name: Run weekly CodeGen and Pull Request action

on:
  workflow_dispatch:
  schedule:
    # Run weekly on Mondays at 02:00 UTC.
    - cron: '0 2 * * MON'

concurrency:
  # Standard AGENTS.md "Concurrency" convention. Scheduled runs always
  # have `github.ref == refs/heads/<default-branch>` (cron's default),
  # and the reusable workflow `run-codegen-pull-request-task.yml` then
  # matrixes over both `main` and `develop` internally — so a single
  # group per workflow+ref serializes all matrix legs of all scheduled
  # / dispatched runs in practice.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  run-codegen:
    name: Run codegen and pull request job
    uses: ./.github/workflows/run-codegen-pull-request-task.yml
    secrets: inherit
    permissions:
      contents: write
      pull-requests: write
