name: Run weekly CodeGen and Pull Request action

on:
  workflow_dispatch:
  schedule:
    # Run weekly on Mondays at 02:00 UTC.
    - cron: '0 2 * * MON'

concurrency:
  # Workflow checks out and opens PRs against both `main` and `develop`
  # via a matrix in `run-codegen-pull-request-task.yml` (branch names
  # `codegen-main` and `codegen-develop`). One concurrency group for the
  # whole workflow — a new scheduled or manual run supersedes an
  # in-flight one across both matrix legs.
  group: codegen
  cancel-in-progress: true

jobs:

  run-codegen:
    name: Run codegen and pull request job
    uses: ./.github/workflows/run-codegen-pull-request-task.yml
    secrets: inherit
    permissions:
      contents: write
      pull-requests: write
