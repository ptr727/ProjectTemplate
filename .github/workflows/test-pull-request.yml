name: Test pull request action

on:
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # Source-only repo: CI is lint-only. Markdown, spelling, workflow YAML, and the registry/spec JSON are validated with
  # the same configs the editor extensions and CLI use (linter parity). There is no build or unit test.
  lint:
    name: Lint sources job
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:

      - name: Checkout code step
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Lint Markdown step
        run: docker run --rm -v "$PWD":/workdir davidanson/markdownlint-cli2:latest "**/*.md"

      - name: Spell check step
        run: docker run --rm -v "$PWD":/workdir --workdir /workdir ghcr.io/streetsidesoftware/cspell:latest "**/*.md"

      - name: Lint workflows step
        run: docker run --rm -v "$PWD":/repo --workdir /repo rhysd/actionlint:latest -color

      - name: Validate registry and spec step
        run: |
          set -euo pipefail
          for f in registry/*.json spec/*.json repo-config/*.json; do
            jq empty "$f"
          done
          python3 spec/validate.py

  # GitHub Actions does not support required status checks on conditional jobs, so a single always-run aggregator gates
  # the merge. Its name is the ruleset-bound required status-check context - do NOT rename it.
  check-workflow-status:
    name: Check pull request workflow status
    runs-on: ubuntu-latest
    needs: [ lint ]
    if: always()
    steps:
      - name: Check workflow results step
        run: |
          set -euo pipefail
          if [[ "${{ needs.lint.result }}" != "success" ]]; then
            echo "Job 'lint' did not succeed (${{ needs.lint.result }}); refusing to pass."
            exit 1
          fi
