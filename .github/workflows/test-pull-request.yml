name: Test pull request action

on:
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # Source-only repo: CI is lint-only. Markdown, spelling, workflow YAML, and the registry/spec JSON are validated with
  # the same configs the editor extensions and CLI use (linter parity). There is no build or unit test.
  lint:
    name: Lint sources job
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:

      - name: Checkout code step
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # Doc linters run as pinned action wrappers. editorconfig-checker's action is install-only, so it runs via Docker.
      - name: Lint Markdown step
        uses: DavidAnson/markdownlint-cli2-action@8de2aa07cae85fd17c0b35642db70cf5495f1d25 # v24.0.0
        with:
          globs: '**/*.md'

      # Spelling gate is scoped to the two files every repo visitor sees. Broad spell-checking across all markdown is
      # the cspell editor extension's job (live, any file); forcing all *.md through CI would mean endlessly padding
      # cspell.json for every technical term. A repo may widen this list, but README + HISTORY is the shipped default.
      - name: Spell check step
        uses: streetsidesoftware/cspell-action@de2a73e963e7443969755b648a1008f77033c5b2 # v8.4.0
        with:
          files: |
            README.md
            HISTORY.md
          incremental_files_only: false

      - name: Lint workflows step
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0

      - name: Check EditorConfig step
        run: docker run --rm -v "$PWD":/check --workdir /check mstruebing/editorconfig-checker:latest

      - name: Validate registry and spec step
        run: |
          set -euo pipefail
          for f in registry/*.json spec/*.json repo-config/*.json; do
            jq empty "$f"
          done
          python3 spec/validate.py

  # GitHub Actions does not support required status checks on conditional jobs, so a single always-run aggregator gates
  # the merge. Its name is the ruleset-bound required status-check context - rename it and the ruleset context together.
  check-workflow-status:
    name: Check pull request workflow status job
    runs-on: ubuntu-latest
    needs: [ lint ]
    if: always()
    steps:
      - name: Check workflow results step
        run: |
          set -euo pipefail
          if [[ "${{ needs.lint.result }}" != "success" ]]; then
            echo "Job 'lint' did not succeed (${{ needs.lint.result }}); refusing to pass."
            exit 1
          fi
