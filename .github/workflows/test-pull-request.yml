name: Test pull request action

on:
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # The reusable validation gate (validate-task.yml) - the same job publish-release runs before a release.
  validate:
    name: Validate sources job
    uses: ./.github/workflows/validate-task.yml
    permissions:
      contents: read
    with:
      python-directories: .
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # Windows is a supported fleet host, and the hub's tooling broke there unnoticed while only Linux ran its suite.
  # The suite runs from Git Bash, the shell a Windows host runs it from, and without coverage, since the Linux leg owns the report.
  windows-test:
    name: Windows unit test job
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:

      - name: Checkout code step
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup python step
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Run Python tests step
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m unittest discover -s tests

  # GitHub Actions does not support required status checks on conditional jobs, so a single always-run aggregator gates the merge.
  # Its name is the ruleset-bound required status-check context, so rename it and the ruleset context together.
  check-workflow-status:
    name: Check pull request workflow status job
    runs-on: ubuntu-latest
    needs: [ validate, windows-test ]
    if: always()
    steps:
      - name: Check workflow results step
        run: |
          set -Eeuo pipefail
          if [[ "${{ needs.validate.result }}" != "success" ]]; then
            echo "Job 'validate' did not succeed (${{ needs.validate.result }}); refusing to pass."
            exit 1
          fi
          if [[ "${{ needs.windows-test.result }}" != "success" ]]; then
            echo "Job 'windows-test' did not succeed (${{ needs.windows-test.result }}); refusing to pass."
            exit 1
          fi
