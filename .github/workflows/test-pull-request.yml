name: Test pull request

on:
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  test-build:
    name: Run build tests
    uses: ./.github/workflows/test-project-task.yml
    secrets: inherit

  test-docker:
    name: Test docker build
    uses: ./.github/workflows/test-docker-task.yml
    secrets: inherit
