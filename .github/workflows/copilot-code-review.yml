name: Copilot code review environment action

# Temporary measurement for #1321.
# It asks whether a setup step can place content where the Copilot reviewer reads it.
# GitHub matches this file by path and the job by id, so neither name is a convention.
# Copilot checks the repository out after these steps, and that checkout cleans untracked files.
# The token is therefore written to three locations rather than to the workspace alone.

on:
  workflow_dispatch:
  pull_request:
    branches: [main, develop]
    paths:
      - .github/workflows/copilot-code-review.yml

concurrency:
  group: '${{ github.workflow }}-${{ github.ref }}'
  cancel-in-progress: true

permissions: {}

jobs:
  copilot-setup-steps:
    name: Copilot setup steps job
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # No checkout is needed here.
      # It would also persist a credential in the workspace a reviewer then reads.
      - name: Write probe token step
        # The token is never printed, since a log on this public repository would publish it.
        # A review could then quote it without having read any file.
        run: |
          set -Eeuo pipefail
          : "${RUN_ID:?run id is empty, which would write a forgeable token}"
          token="PROBE-SETUP-${RUN_ID}"
          mkdir -p "${GITHUB_WORKSPACE}/.copilot-probe"
          printf '%s\n' "$token" > "${GITHUB_WORKSPACE}/.copilot-probe/setup-token.txt"
          printf '%s\n' "$token" > "${RUNNER_TEMP}/copilot-probe-setup-token.txt"
          printf '%s\n' "$token" > "${HOME}/.copilot-probe-setup-token.txt"
        env:
          RUN_ID: ${{ github.run_id }}
