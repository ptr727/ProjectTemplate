name: Run codegen and pull request task

on:
  workflow_call:
    secrets:
      # Use PAT to trigger workflows
      WORKFLOW_PAT:
        required: true
      # API Ninjas API key
      NINJA_API_KEY:
        required: true

jobs:

  codegen:
    name: Run codegen and pull request job
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:

      - name: Setup .NET SDK step
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.x

      - name: Checkout code step
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Run codegen step
        run: |
          dotnet run --project ./CodeGen/CodeGen.csproj -- \
            --codepath ./CodeGen \
            --apikey "${{ secrets.NINJA_API_KEY }}"

      - name: Format code step
        run: |
          dotnet tool restore
          dotnet csharpier format --log-level=debug .
          git status

      - name: Create pull request step
        uses: peter-evans/create-pull-request@v8
        id: cpr
        with:
          # Use GITHUB_TOKEN to sign the commit, but will not trigger workflows
          token: ${{ secrets.GITHUB_TOKEN }}
          base: main
          branch: codegen
          title: 'Update codegen files'
          body: 'This PR updates the codegen files.'
          commit-message: 'Update codegen files'
          delete-branch: true
          sign-commits: true

      - name: Trigger PR workflows step
        if: steps.cpr.outputs.pull-request-number != ''
        run: |
          PR="${{ steps.cpr.outputs.pull-request-number }}"
          gh pr close "$PR"
          gh pr reopen "$PR"
        env:
          # Use PAT to trigger workflows
          GH_TOKEN: ${{ secrets.WORKFLOW_PAT }}
