name: Run .NET codegen and pull request task

on:
  workflow_call:
    secrets:
      CODEGEN_APP_CLIENT_ID:
        required: true
      CODEGEN_APP_PRIVATE_KEY:
        required: true

jobs:

  # No job-level permissions declared.
  # This is because every write here (the checkout, the pull request) uses the App token.
  # So GITHUB_TOKEN needs no scope and the caller can grant permissions: {}.
  codegen:
    name: Run ${{ matrix.target.ref }} codegen and pull request job
    runs-on: ubuntu-latest
    strategy:
      # Each branch gets its own parallel codegen run and PR.
      # One branch's failure does not affect the other.
      fail-fast: false
      matrix:
        target:
          - ref: main
            branch: codegen-main
          - ref: develop
            branch: codegen-develop

    steps:

      # App token so the PR open fires pull_request workflow events.
      # A GITHUB_TOKEN open does not.
      - name: Generate GitHub App token step
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.CODEGEN_APP_CLIENT_ID }}
          private-key: ${{ secrets.CODEGEN_APP_PRIVATE_KEY }}

      - name: Checkout code step
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.target.ref }}
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false

      # The SDK step follows the checkout, since it reads the caller's global.json.
      # The caller's global.json selects the SDK line, or the dotnet-sdk action's fallback line where it carries none yet.
      - name: Setup .NET SDK step
        uses: $/.github/actions/dotnet-sdk

      - name: Run codegen hook step
        if: ${{ hashFiles('.github/actions/codegen/action.yml') != '' }}
        uses: ./.github/actions/codegen

      - name: Missing codegen hook step
        if: ${{ hashFiles('.github/actions/codegen/action.yml') == '' }}
        run: |
          set -Eeuo pipefail
          echo "::error::Required hook missing: .github/actions/codegen/action.yml"
          exit 1

      - name: Format code step
        run: |
          set -Eeuo pipefail
          dotnet tool restore
          dotnet husky install
          dotnet csharpier format --log-level=debug .
          git status

      # App token: fires pull_request workflow events and creates verified commits as the app.
      - name: Create pull request step
        id: cpr
        uses: peter-evans/create-pull-request@15733dbdfeedb4f7fdb73d13c6f5ac83b710fab8 # v8.1.2
        with:
          token: ${{ steps.app-token.outputs.token }}
          base: ${{ matrix.target.ref }}
          branch: ${{ matrix.target.branch }}
          title: 'Update codegen files'
          body: 'This PR updates the codegen files.'
          commit-message: 'Update codegen files'
          delete-branch: true
          sign-commits: true
