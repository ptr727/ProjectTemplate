# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# The github-actions ecosystem covers every workflow and composite action this repo ships.
# The pip pair covers the ruff version the validator runs, pinned in .github/actions/python-tool-pins/requirements.txt.
# Both main and develop are targeted so each stays current independently of the develop to main release cadence.
# The merge-bot auto-merges each base with its per-base method.
# See catalog/snippets/configs/dependabot.yml for the multi-ecosystem reference, covering nuget, uv, and pip, that a code-shipping repo uses.
version: 2
updates:

  - package-ecosystem: "github-actions"
    target-branch: "main"
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: "daily"
    groups:
      actions-deps:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    target-branch: "develop"
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: "daily"
    groups:
      actions-deps:
        patterns:
          - "*"

  - package-ecosystem: "pip"
    target-branch: "main"
    directory: "/.github/actions/python-tool-pins"
    schedule:
      interval: "daily"

  - package-ecosystem: "pip"
    target-branch: "develop"
    directory: "/.github/actions/python-tool-pins"
    schedule:
      interval: "daily"
