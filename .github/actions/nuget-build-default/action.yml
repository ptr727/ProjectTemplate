name: Build NuGet package default
description: Build the package and upload it for the caller stub's publish-nuget job and the GitHub release.

inputs:
  branch:
    description: Logical branch driving build configuration. main gives Release, anything else Debug.
    required: true
  smoke:
    description: Smoke mode skips the build-artifact upload and the release-asset upload, since nothing would consume either.
    required: false
    default: 'false'
  semver2:
    required: true
  assembly-version:
    required: true
  assembly-file-version:
    required: true
  assembly-informational-version:
    required: true
  project-file:
    description: Path to the .NET project file.
    required: true

runs:
  using: composite
  steps:

    - name: Require project file step
      if: ${{ inputs.project-file == '' }}
      shell: bash
      run: |
        set -Eeuo pipefail
        echo "::error::project-file is required when the hub NuGet default runs."
        exit 1

    - name: Setup .NET SDK step
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        dotnet-version: 10.x

    # Build output and packages land in the same publish/ folder so they archive together.
    - name: Build library step
      shell: bash
      env:
        BRANCH: ${{ inputs.branch }}
        PROJECT_FILE: ${{ inputs.project-file }}
        SEMVER2: ${{ inputs.semver2 }}
        ASSEMBLY_VERSION: ${{ inputs.assembly-version }}
        ASSEMBLY_FILE_VERSION: ${{ inputs.assembly-file-version }}
        ASSEMBLY_INFORMATIONAL_VERSION: ${{ inputs.assembly-informational-version }}
      run: |
        set -Eeuo pipefail
        configuration=Debug
        [[ "$BRANCH" == "main" ]] && configuration=Release
        dotnet build "$PROJECT_FILE" \
          --configuration "$configuration" \
          -property:OutputPath="$RUNNER_TEMP/publish/" \
          -property:PackageOutputPath="$RUNNER_TEMP/publish/" \
          -property:Version="$SEMVER2" \
          -property:FileVersion="$ASSEMBLY_FILE_VERSION" \
          -property:AssemblyVersion="$ASSEMBLY_VERSION" \
          -property:InformationalVersion="$ASSEMBLY_INFORMATIONAL_VERSION" \
          -property:PackageVersion="$SEMVER2"

    # A push from here runs inside the hub task's job, so an adopter's registry sees this hub in the job_workflow_ref claim and rejects it.
    # The .snupkg travels with the .nupkg so the publishing job pushes symbols in the same command.
    # Skipped on smoke, since the publish-nuget job runs only on a real publish and nothing would consume it.
    - name: Upload build artifacts step
      if: ${{ inputs.smoke != 'true' }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: nuget-build-${{ inputs.branch }}
        path: |
          ${{ runner.temp }}/publish/*.nupkg
          ${{ runner.temp }}/publish/*.snupkg
        # A project that packs nothing would otherwise only warn, create no artifact at all, cut a release, and fail one job later on a download that cannot say why.
        if-no-files-found: error
        # Consumed within the run by the caller stub's publish-nuget job, so minimize artifact storage.
        retention-days: 1

    - name: Zip output step
      if: ${{ inputs.smoke != 'true' }}
      shell: bash
      run: 7z a -t7z "$RUNNER_TEMP/nuget.7z" "$RUNNER_TEMP"/publish/*

    # GitHub-release asset, uploaded under the release-asset-<branch>-<target> pattern the github-release job collects.
    - name: Upload release asset step
      if: ${{ inputs.smoke != 'true' }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: release-asset-${{ inputs.branch }}-nuget
        path: ${{ runner.temp }}/nuget.7z
        # Consumed within the run by the github-release job, so minimize artifact storage.
        retention-days: 1
