name: .NET SDK
description: >-
  Install the .NET SDK line the caller's global.json selects through its sdk.version, so a TFM move
  edits that file alone. A caller carrying no such global.json yet gets the fallback line the
  selection step names, which the hub's tests hold to the global.json baseline's major.

runs:
  using: composite
  steps:

    - name: Select .NET SDK line step
      id: sdk-line
      shell: bash
      run: |
        set -Eeuo pipefail
        fallback=10.x
        # A file passed on has to parse for both the dotnet host and setup-dotnet's JSON5 read.
        # Comments are the one extension both accept, so they are dropped outside strings and the rest is read with json.loads.
        # So a commented file still selects its line, and one with no sdk.version still gets the fallback.
        python3 - "$fallback" <<'PY'
        import json
        import os
        import re
        import sys
        from pathlib import Path

        fallback = sys.argv[1]
        path = Path("global.json")
        selected = False
        if path.is_file():
            # A byte that is not UTF-8 is replaced, as setup-dotnet's own UTF-8 read does, and the dotnet host does not validate it.
            text = path.read_text(encoding="utf-8-sig", errors="replace")
            comments = re.compile(r'("(?:\\.|[^"\\])*")|//[^\n]*|/\*.*?\*/', re.S)
            # A comment becomes blanks that keep its newlines, so a parse error names the line in the caller's file.
            text = comments.sub(lambda match: match.group(1) or re.sub(r"[^\n]", " ", match.group(0)), text)
            try:
                document = json.loads(text)
            except ValueError as error:
                print(f"::warning::global.json could not be read ({error}), so this installs the {fallback} fallback.")
            else:
                # The host reads a missing or null sdk as no selection, so either takes the fallback rather than failing.
                sdk = document.get("sdk")
                selected = isinstance(sdk, dict) and isinstance(sdk.get("version"), str)
        with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
            output.write("global-json-file=global.json\n" if selected else f"dotnet-version={fallback}\n")
        PY

    - name: Setup .NET SDK step
      uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
      with:
        global-json-file: ${{ steps.sdk-line.outputs.global-json-file }}
        dotnet-version: ${{ steps.sdk-line.outputs.dotnet-version }}
