name: .NET SDK
description: >-
  Install the .NET SDK line the caller's global.json selects through its sdk.version, so a TFM move
  edits that file alone. A caller carrying no such global.json yet gets the fallback line the
  selection step names, which the hub's tests hold to the global.json baseline's major.

runs:
  using: composite
  steps:

    - name: Select .NET SDK line step
      id: sdk-line
      shell: bash
      run: |
        set -Eeuo pipefail
        fallback=10.x
        status=1
        if [[ -f global.json ]]; then
          status=0
          jq -e '.sdk.version' global.json >/dev/null || status=$?
        fi
        if [[ $status -eq 0 ]]; then
          echo "global-json-file=global.json" >> "$GITHUB_OUTPUT"
        else
          # The dotnet host accepts a global.json jq cannot read, such as one holding a comment, so this warns rather than fails.
          # A wrong line then fails the first dotnet command loudly, and this warning names the cause.
          if [[ $status -gt 1 ]]; then
            echo "::warning::jq could not read global.json (exit $status), so this installs the $fallback fallback rather than the line it selects."
          fi
          echo "dotnet-version=$fallback" >> "$GITHUB_OUTPUT"
        fi

    - name: Setup .NET SDK step
      uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
      with:
        global-json-file: ${{ steps.sdk-line.outputs.global-json-file }}
        dotnet-version: ${{ steps.sdk-line.outputs.dotnet-version }}
