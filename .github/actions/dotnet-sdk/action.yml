name: .NET SDK
description: >-
  Install the .NET SDK line the caller's global.json selects through its sdk.version, so a TFM move
  edits that file alone. A caller carrying no such global.json yet gets 10.x.

runs:
  using: composite
  steps:

    - name: Select .NET SDK line step
      id: sdk-line
      shell: bash
      run: |
        set -Eeuo pipefail
        if [[ -f global.json ]] && jq -e '.sdk.version' global.json >/dev/null; then
          echo "global-json-file=global.json" >> "$GITHUB_OUTPUT"
        else
          echo "dotnet-version=10.x" >> "$GITHUB_OUTPUT"
        fi

    - name: Setup .NET SDK step
      uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
      with:
        global-json-file: ${{ steps.sdk-line.outputs.global-json-file }}
        dotnet-version: ${{ steps.sdk-line.outputs.dotnet-version }}
