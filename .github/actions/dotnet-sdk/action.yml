name: .NET SDK
description: >-
  Install the .NET SDK line the caller's global.json selects through its sdk.version, so a TFM move
  edits that file alone. A caller carrying no such global.json yet gets the fallback line the
  selection step names, which the hub's tests hold to the global.json baseline's major.

runs:
  using: composite
  steps:

    - name: Select .NET SDK line step
      id: sdk-line
      shell: bash
      run: |
        set -Eeuo pipefail
        fallback=10.x
        status=1
        if [[ -f global.json ]]; then
          status=0
          jq -e '.sdk.version' global.json >/dev/null || status=$?
        fi
        # Exit 1 is a global.json jq read that carries no sdk.version, the one case the fallback serves.
        # A file jq cannot parse, such as one holding a comment, is still valid to the dotnet host.
        # It is valid to setup-dotnet too, which reads it as JSON5.
        # So that file goes to setup-dotnet, which installs the line it selects.
        if [[ $status -eq 1 ]]; then
          echo "dotnet-version=$fallback" >> "$GITHUB_OUTPUT"
        else
          if [[ $status -gt 1 ]]; then
            echo "::notice::jq could not read global.json (exit $status), so setup-dotnet reads the SDK line from it as JSON5."
          fi
          echo "global-json-file=global.json" >> "$GITHUB_OUTPUT"
        fi

    - name: Setup .NET SDK step
      uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
      with:
        global-json-file: ${{ steps.sdk-line.outputs.global-json-file }}
        dotnet-version: ${{ steps.sdk-line.outputs.dotnet-version }}
