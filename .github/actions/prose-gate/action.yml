name: Fleet prose gate
description: Check the lines a change touches against the fleet prose rules.

inputs:
  base:
    description: Ref to diff against, so only lines the change touches are reported.
    required: true
  paths:
    description: Paths to scan.
    required: false
    default: .
runs:
  using: composite
  steps:
    # The caller checks out with fetch-depth 0, because a diff against the base needs its history.
    - name: Check prose step
      shell: bash
      env:
        BASE: ${{ inputs.base }}
        PATHS: ${{ inputs.paths }}
        # A caller reaches this gate at whatever hub commit its workflow pins, and only the action knows which one that is, since a checked-out action carries no history to read it from.
        # Unnamed, a finding from a stale pin reproduces against no local run and reads as a gate defect rather than as a version gap, which is the reading it got on #1412.
        # Both the context and the default environment variable are read, because the context's value for a repository-relative reference is undocumented and the two are populated by different paths.
        # Either being empty leaves the script to fall back to its own checkout, which is the correct answer whenever the action was not fetched from a pin.
        # This repository calls the reusable workflow by a workspace-relative path, so its own runs may well take that fallback, and a downstream repository calling it at a pin is the case these exist for.
        # What each form populates is read off a real run rather than predicted here, since predicting it is what a verdict naming its own copy exists to stop anyone having to do.
        ACTION_REPOSITORY: ${{ github.action_repository }}
        ACTION_REF: ${{ github.action_ref }}
      run: |
        set -Eeuo pipefail
        # Check the base resolves before scanning, so an empty or absent ref fails naming itself.
        # Unresolvable, the run would report the repository's whole backlog against this change.
        # A shallow checkout is the usual cause, so the caller fetches full history.
        # A base that is a freshly created merge commit can still lag GitHub's own replication, so retry with backoff before failing rather than treat that lag as a gate failure.
        resolved=false
        for delay in 0 2 4 8 15 30; do
          if [ "$delay" -gt 0 ]; then
            sleep "$delay"
            git fetch --quiet origin "$BASE" 2>/dev/null || true
          fi
          if git rev-parse --verify --quiet "$BASE^{commit}" >/dev/null; then
            resolved=true
            break
          fi
        done
        if ! "$resolved"; then
          echo "::error::Diff base '$BASE' does not resolve in this checkout." >&2
          echo "::error::Check the ref name and that the job checks out with fetch-depth 0." >&2
          exit 1
        fi
        # A caller may write paths as a multi-line YAML block, and `read -ra` stops at a newline.
        # Fold newlines into spaces first, so every path is read.
        # Left unfolded it scans only the first path and reports the rest clean.
        # That is a silent under-scan, the one failure a gate must never have.
        # Splitting on whitespace keeps several paths as several arguments.
        # Passing the array quoted keeps each element literal, where an unquoted one would glob.
        read -ra scan <<<"$(printf '%s' "$PATHS" | tr '\n' ' ')"
        if [ "${#scan[@]}" -eq 0 ]; then
          echo "::error::No paths to scan after parsing the paths input." >&2
          exit 1
        fi
        echo "Scanning ${#scan[@]} path(s): ${scan[*]}"
        exclude_args=()
        excluded_paths=()
        exclude_file=".github/prose-gate-excludes"
        if [ -f "$exclude_file" ]; then
          excluded=""
          while IFS= read -r excluded || [ -n "$excluded" ]; do
            excluded="${excluded#"${excluded%%[![:space:]]*}"}"
            excluded="${excluded%"${excluded##*[![:space:]]}"}"
            if [[ -z "$excluded" || "$excluded" == \#* ]]; then
              continue
            fi
            excluded_paths+=("$excluded")
            exclude_args+=(--exclude "$excluded")
          done < "$exclude_file"
          echo "Excluding ${#excluded_paths[@]} path(s) from $exclude_file: ${excluded_paths[*]}"
        fi
        # The context is preferred and the default environment variable is the fallback, so a reference form that populates only one of them still names the pin.
        # Naming a repository with no ref, or a ref with no repository, would be worse than naming nothing, since the value exists to identify one commit.
        # Defaulted rather than read bare, since `set -u` makes an unset variable fatal and a harness that runs this block outside Actions sets neither.
        action_repository="${ACTION_REPOSITORY:-${GITHUB_ACTION_REPOSITORY:-}}"
        action_ref="${ACTION_REF:-${GITHUB_ACTION_REF:-}}"
        provenance_args=()
        if [ -n "$action_repository" ] && [ -n "$action_ref" ]; then
          provenance_args=(--provenance "${action_repository}@${action_ref}")
        fi
        # Options first, then `--`, so every remaining token is read as a literal path.
        # A path-shaped token beginning with a dash would otherwise parse as an option, and
        # `--list-files` in that position turns the gate into a file listing that exits 0.
        python3 "$GITHUB_ACTION_PATH/prose_lint.py" --diff "$BASE" "${exclude_args[@]}" "${provenance_args[@]}" -- "${scan[@]}"
