name: Docker lint pins
description: Read the Docker lint image references, each a version tag with its digest, from the Dockerfile beside this action.

outputs:
  editorconfig-checker:
    description: The editorconfig-checker image reference the Dockerfile pins.
    value: ${{ steps.read.outputs.editorconfig-checker }}
  shellcheck:
    description: The shellcheck image reference the Dockerfile pins.
    value: ${{ steps.read.outputs.shellcheck }}
  shfmt:
    description: The shfmt image reference the Dockerfile pins.
    value: ${{ steps.read.outputs.shfmt }}
  powershell:
    description: The PowerShell image reference the Dockerfile pins.
    value: ${{ steps.read.outputs.powershell }}
  docker-lint:
    description: The absolute path of scripts/docker_lint.py in the hub tree this action runs from, so at the calling workflow's own ref, never another. Its --pull mode is the lint steps' one pull retry.
    value: ${{ steps.locate.outputs.docker-lint }}

runs:
  using: composite
  steps:
    - name: Locate Docker lint script step
      id: locate
      shell: bash
      run: |
        set -Eeuo pipefail
        echo "docker-lint=$(cd "$GITHUB_ACTION_PATH/../../.." && pwd)/scripts/docker_lint.py" >> "$GITHUB_OUTPUT"

    - name: Read Docker lint pins step
      id: read
      shell: bash
      env:
        DOCKER_LINT: ${{ steps.locate.outputs.docker-lint }}
      run: |
        set -Eeuo pipefail
        stages=(editorconfig-checker actionlint markdownlint cspell shellcheck shfmt powershell)
        args=()
        for stage in "${stages[@]}"; do
          args+=(--pin "$stage")
        done
        errors=$(mktemp)
        if ! pins=$(python3 "$DOCKER_LINT" "${args[@]}" 2> "$errors"); then
          cat "$errors" >&2
          echo "::error::$GITHUB_ACTION_PATH/Dockerfile could not be read for its lint pins: $(tail -n 1 "$errors")"
          exit 1
        fi
        rm -f "$errors"
        echo "$pins" >> "$GITHUB_OUTPUT"
