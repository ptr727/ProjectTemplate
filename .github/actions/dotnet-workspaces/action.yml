name: .NET workspaces
description: >-
  Resolve the .NET solutions or projects the validator names on each dotnet call, from the tracked
  tree. A bare dotnet format or dotnet test resolves one workspace from the working directory, so
  it fails at a root holding none or more than one.

inputs:
  projects:
    description: >-
      Git pathspec matching the tracked .csproj files to name where no solution is named, for
      example ':(glob)**/*Tests*.csproj'.
    required: true
  solutions:
    description: >-
      'true' to name each tracked .sln or .slnx in place of the projects wherever the tree holds
      one.
    required: false
    default: 'false'

outputs:
  workspaces:
    description: >-
      One tracked solution or project path per line. Empty where the root holds exactly one
      solution or project, which a bare dotnet call resolves from the working directory.
    value: ${{ steps.resolve.outputs.workspaces }}

runs:
  using: composite
  steps:
    - name: Resolve .NET workspaces step
      id: resolve
      shell: bash
      env:
        PROJECTS: ${{ inputs.projects }}
        SOLUTIONS: ${{ inputs.solutions }}
      run: |
        set -Eeuo pipefail
        root=$(git ls-files -- ':(glob)*.sln' ':(glob)*.slnx' ':(glob)*.csproj')
        workspaces=
        if [ -z "$root" ] || [ "$root" != "${root%%$'\n'*}" ]; then
          if [ "$SOLUTIONS" = true ]; then
            workspaces=$(git ls-files -- ':(glob)**/*.sln' ':(glob)**/*.slnx')
          fi
          if [ -z "$workspaces" ]; then
            workspaces=$(git ls-files -- "$PROJECTS")
          fi
        fi
        {
          echo "workspaces<<EOF"
          if [ -n "$workspaces" ]; then
            printf '%s\n' "$workspaces"
          fi
          echo "EOF"
        } >> "$GITHUB_OUTPUT"
