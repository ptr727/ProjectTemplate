# The hub's own validate hook, run by validate-task.yml's validate job for this repo.
# The fleet doc-lint block and the Python leg in validate-task.yml, which runs the unittest suite under tests/, do not cover the rest of the hub's own machinery.
# Carrying this hook makes the hub exercise the override path on every hub pull request, where a repo with no hook of its own exercises the hub default at .github/actions/validate-default.
name: Validate repository (hub)
description: Registry and spec validation, the self-tests outside the unittest suite, the fleet-skills freshness check, and the unclassified-character report.

runs:
  using: composite
  steps:

    - name: Validate registry and spec step
      shell: bash
      run: |
        set -Eeuo pipefail
        for f in registry/*.json spec/*.json repo-config/*.json; do
          jq empty "$f"
        done
        python3 spec/validate.py

    - name: Setup uv step
      uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      with:
        python-version: "3.13"

    # The unittest suite under tests/ is the validator's Python leg, since the hub declares '.' in python-directories, so it runs there under coverage and uploads to Codecov like any adopter's.
    # What stays here is each self-test that is not a unittest suite, and the agent-safety kit carries its own tests because it ships as a unit.
    # Every run after the first appends, so one report covers these self-tests, informational with no threshold adopted.
    - name: Run script self-tests step
      shell: bash
      run: |
        set -Eeuo pipefail
        uvx coverage@latest run --source=scripts,spec,host-setup spec/audit.py --selftest
        uvx coverage@latest run --source=scripts,spec,host-setup --append spec/workflow_reuse.py --selftest
        uvx coverage@latest run --source=scripts,spec,host-setup --append host-setup/agent-safety/claude/gh-write-guard.py --selftest
        uvx coverage@latest run --source=scripts,spec,host-setup --append host-setup/agent-safety/claude/test_install.py
        uvx coverage@latest report

    # Read-only: fails if a generated skill distribution differs from .agents/skills/.
    - name: Check fleet skills are current step
      shell: bash
      run: python3 scripts/build_dist.py --check

    # The burn-down goes to the run's job summary rather than into the tree, per scripts/README.md, on every event since it describes the commit rather than a comparison against a base.
    # No pull request is refused over a canonical unit's coverage, which the weekly canonical-review-sweep.yml files as its own work instead, per GOVERNANCE.md "Verification Discipline".
    # The step still fails on the engine's boundary exit, meaning it could not read what it needs rather than having read it and found a unit uncovered, since a boundary is not a verdict about coverage.
    # Read-only, and `!cancelled()` so it renders after an earlier step failed.
    - name: Render the canonical review burn-down step
      if: ${{ !cancelled() }}
      shell: bash
      run: python3 scripts/canonical_review.py report >> "$GITHUB_STEP_SUMMARY"

    # Warn-only, and visible rather than absent: an unrun check is one nobody acts on.
    # A finding here names a character no tier covers, and classifying it is a fleet-law edit rather than a prose fix.
    - name: Report unclassified characters step
      shell: bash
      continue-on-error: true
      run: python3 scripts/prose_lint.py . --check charset-unknown --summary
