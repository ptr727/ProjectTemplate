# The hub's own validate hook, run by validate-task.yml's validate job for this repo.
# The fleet doc-lint block and the generic unit-test job in validate-task.yml do not cover the hub's own machinery.
# Carrying this hook makes the hub exercise the override path on every hub pull request, where a repo with no hook of its own exercises the hub default at .github/actions/validate-default.
name: Validate repository (hub)
description: Registry and spec validation, the script self-test suite, the fleet-skills freshness check, and the unclassified-character report.

runs:
  using: composite
  steps:

    - name: Validate registry and spec step
      shell: bash
      run: |
        set -Eeuo pipefail
        for f in registry/*.json spec/*.json repo-config/*.json; do
          jq empty "$f"
        done
        python3 spec/validate.py

    - name: Setup uv step
      uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      with:
        python-version: "3.13"

    # Each gate here is proven by a case that reintroduces the fault it catches, wherever it lives.
    # A test sits with the layer that owns it rather than beside the file it names, so a read-only gate over the spec and the host tooling lives in scripts/tests/ even where its subject is shell.
    # The agent-safety kit carries its own tests because it ships as a unit.
    # Every run goes through coverage with --append, so one report covers the whole self-test surface, informational with no threshold adopted.
    - name: Run script self-tests step
      shell: bash
      run: |
        set -Eeuo pipefail
        uvx coverage@latest run --source=scripts,spec,host-setup -m unittest discover -s scripts/tests
        uvx coverage@latest run --source=scripts,spec,host-setup --append spec/audit.py --selftest
        uvx coverage@latest run --source=scripts,spec,host-setup --append spec/workflow_reuse.py --selftest
        uvx coverage@latest run --source=scripts,spec,host-setup --append host-setup/agent-safety/claude/gh-write-guard.py --selftest
        uvx coverage@latest run --source=scripts,spec,host-setup --append host-setup/agent-safety/claude/test_install.py
        uvx coverage@latest report

    # Read-only: fails if a generated skill distribution differs from .agents/skills/.
    - name: Check fleet skills are current step
      shell: bash
      run: python3 scripts/build_dist.py --check

    # The carried-content half of the local-review rule, per GOVERNANCE.md "Verification Discipline".
    # The .husky/pre-push hook runs the same check and is bypassable by construction, so this is where it actually binds.
    # Pull requests only, since a canonical unit's change is measured against the branch it is proposed into and a push carrying no pull request has none.
    # The base commit reaches the script through the environment rather than through an expression inside it, so a ref value can never be read as shell.
    - name: Check carried canonical content review coverage step
      if: github.event.pull_request != null
      shell: bash
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
      run: |
        set -Eeuo pipefail
        # This job checks out at the default depth, and the check measures each unit from the merge-base with the pull request's base, which a depth-1 clone holds neither side of.
        # Deepening here rather than raising the job's own fetch-depth keeps the cost with the hub, whose hook this is, rather than on every repository that reuses this workflow.
        # The engine reports an unresolvable base as a boundary rather than as a verdict, so without this the step fails loudly instead of passing blind, which is how the gap was found.
        if [ "$(git rev-parse --is-shallow-repository)" = true ]; then
          git fetch --no-tags --prune --unshallow origin
        fi
        # The base is an ancestor of the ref this event checks out, so unshallowing normally supplies it, and it is fetched by name where it does not.
        if ! git rev-parse --verify --quiet "$BASE_SHA^{commit}"; then
          git fetch --no-tags origin "$BASE_SHA"
        fi
        python3 scripts/canonical_review.py check --target "$BASE_SHA"

    # The burn-down goes to the run's job summary rather than into the tree, per scripts/README.md, on every event since it describes the commit rather than a comparison against a base.
    # Read-only and informational, so `!cancelled()` renders it after an earlier step failed.
    - name: Render the canonical review burn-down step
      if: ${{ !cancelled() }}
      shell: bash
      run: python3 scripts/canonical_review.py report >> "$GITHUB_STEP_SUMMARY"

    # Warn-only, and visible rather than absent: an unrun check is one nobody acts on.
    # A finding here names a character no tier covers, and classifying it is a fleet-law edit rather than a prose fix.
    - name: Report unclassified characters step
      shell: bash
      continue-on-error: true
      run: python3 scripts/prose_lint.py . --check charset-unknown --summary
