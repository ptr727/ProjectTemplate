# This is the actionlint config.
# The paths.<glob>.ignore key filters specific error messages by regex, scoped to the file that needs it, rather than disabling the rule fleet-wide.
#
# GitHub's documented $/ self-repository syntax is not recognized by actionlint yet.
# Remove each scoped ignore when actionlint accepts that form.
paths:
  '.github/workflows/build-release-task.yml':
    ignore:
      - 'reusable workflow call "\$/\.github/workflows/'
      - 'specifying action "\$/\.github/actions/'
  '.github/workflows/build-docker-task.yml':
    ignore:
      - 'specifying action "\$/\.github/actions/'
  '.github/workflows/publish-docker-readme-task.yml':
    ignore:
      - 'specifying action "\$/\.github/actions/'
  '.github/workflows/validate-task.yml':
    ignore:
      - 'property "workflow_repository" is not defined in object type'
      - 'property "workflow_sha" is not defined in object type'
      - 'specifying action "\$/\.github/actions/'
