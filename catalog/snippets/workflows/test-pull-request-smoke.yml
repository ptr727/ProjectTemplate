name: Test pull request action

on:
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:

  # One entry per target this repo builds, listing that target's own paths, so a touched target never falls through unfiltered (D1.1).
  # A negation such as '!.github/workflows/**' marks a docs-only pull request as a target change, which scenario S2 requires to skip.
  # A repo carrying its own build hook lists .github/actions/** too, since that hook builds the target.
  changes:
    name: Detect changed targets job
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      release: ${{ steps.filter.outputs.release }}
    steps:
      - name: Checkout code step
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Filter changed paths step
        id: filter
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        with:
          filters: |
            release:
              - 'Widget/**'
              - 'Directory.Build.props'
              - 'Directory.Packages.props'
              - 'global.json'
              - 'version.json'
              - '.github/actions/**'

  # A C# or Python repo adds secrets: with CODECOV_TOKEN mapped by name here, per D1.6.
  validate:
    name: Validate sources job
    uses: ptr727/ProjectTemplate/.github/workflows/validate-task.yml@6c88850128629bb449fd73c7fbf82968c6cd1557 # 2.0.587
    permissions:
      contents: read

  # Never publishes and never uploads (D1.3): smoke: true disables every publish path in build-release-task.
  smoke-build:
    name: Smoke build job
    needs: [changes]
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.release == 'true'
    uses: ptr727/ProjectTemplate/.github/workflows/build-release-task.yml@6c88850128629bb449fd73c7fbf82968c6cd1557 # 2.0.587
    permissions:
      contents: read
    # A Docker repo maps DOCKER_HUB_USERNAME and DOCKER_HUB_ACCESS_TOKEN by name here, since the task logs in to Docker Hub on every build for the higher rate limit.
    with:
      smoke: true
      github: false
      dockerhub: false
      # Every enable_* input except enable_release_asset defaults true on the task, so this one-target caller turns off the ones it does not build and leaves its own on that default, the same set its publish-release.yml passes.
      enable_docker: false
      enable_pypi: false
      enable_dotnet_publish: false
      nuget_project: ./Widget/Widget.csproj
      # On a pull_request event github.ref_name is the PR ref (for example 123/merge), never the target branch.
      # The logical branch therefore reads base_ref first and falls back to ref_name only on a non-PR trigger.
      branch: ${{ github.base_ref || github.ref_name }}

  # Treats a skipped smoke-build (an unchanged target) as pass, and blocks on failure or cancelled (D1.5, D7.4).
  check-workflow-status:
    name: Check pull request workflow status job
    runs-on: ubuntu-latest
    needs: [changes, validate, smoke-build]
    if: always()
    steps:
      - name: Check workflow results step
        run: |
          set -Eeuo pipefail
          for result in "changes:${{ needs.changes.result }}" "validate:${{ needs.validate.result }}"; do
            name="${result%%:*}"
            value="${result#*:}"
            if [[ "$value" != "success" ]]; then
              echo "::error::Job '$name' did not succeed ($value)."
              exit 1
            fi
          done
          if [[ "${{ needs.smoke-build.result }}" != "success" && "${{ needs.smoke-build.result }}" != "skipped" ]]; then
            echo "::error::Job 'smoke-build' did not succeed (${{ needs.smoke-build.result }})."
            exit 1
          fi
