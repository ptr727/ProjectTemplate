name: Run daily CodeGen and Pull Request action

on:
  workflow_dispatch:
  schedule:
    # Daily at 04:00 UTC, staggered after the weekly publish so the two don't start together on Mondays.
    - cron: '0 4 * * *'

concurrency:
  # Workflow-only group (no `-${{ github.ref }}`), since the task writes fixed branches.
  # It writes `codegen-main` and `codegen-develop` regardless of the triggering ref.
  # A dispatch and the scheduled run must therefore not race on them.
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:

  run-codegen:
    name: Run codegen and pull request job
    uses: ./.github/workflows/run-codegen-pull-request-task.yml
    secrets: inherit
    permissions:
      contents: write
      pull-requests: write
