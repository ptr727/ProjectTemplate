name: Test pull request action

# Thin caller: the gate is the hub's reusable validate-task.yml, which every fleet repo reaches rather than carries.
# Operational trigger shape (WORKFLOW.md "Branch Model"): a push to develop runs CI advisory.
# A pull_request runs it pre-merge and actionable.
# That is what makes D1.2 hold on this model too.
on:
  push:
    branches: [develop]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:

  # A C# or Python repo adds secrets: with CODECOV_TOKEN mapped by name here, per D1.6.
  validate:
    name: Validate sources job
    uses: ptr727/ProjectTemplate/.github/workflows/validate-task.yml@63cf1c9436876d55889260ce43d3900da2fd9b47 # 2.0.1166
    permissions:
      contents: read
    with:
      workflow-model: operational

  # GitHub Actions does not support required status checks on conditional jobs, so a single always-run aggregator gates the merge.
  # Its name is the ruleset-bound required status-check context: rename it and the ruleset context together.
  # Only a pull_request run takes that name.
  # So a push or dispatch run on a pull request's head cannot post the required check without that pull request's gates.
  check-workflow-status:
    name: ${{ github.event_name == 'pull_request' && 'Check pull request workflow status job' || 'Check workflow status job' }}
    runs-on: ubuntu-latest
    needs: [validate]
    if: always()
    steps:
      - name: Check workflow results step
        run: |
          set -Eeuo pipefail
          if [[ "${{ needs.validate.result }}" != "success" ]]; then
            echo "Job 'validate' did not succeed (${{ needs.validate.result }}); refusing to pass."
            exit 1
          fi
