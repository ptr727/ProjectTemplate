# Reference: multi-ecosystem dual-target Dependabot config for a code-shipping repo.
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# Every ecosystem appears twice, once per target branch (main and develop).
# Both branches therefore stay current on dependency versions independently of the release cadence.
# Push-distribution channels (HACS, distros that pull main) consume main directly.
# The main branch must therefore get bumps without waiting for the next release.
# The merge-bot dispatches the merge method per base ref (squash on develop, merge on main).
# Because develop is strictly forward-only, each branch absorbs its own PRs.
# Security (CVE) PRs always target the default branch regardless of target-branch.
# Keep only the ecosystems the repo actually ships.
#
# Exclude-patterns keeps the fleet's toolchain packages out of the catch-all bump.
# A tool's own version bump can flag previously-compliant code, blocking the whole group over it.
version: 2
updates:

  - package-ecosystem: "nuget"
    target-branch: "main"
    directory: "/"
    schedule:
      interval: "daily"
    groups:
      nuget-deps:
        patterns:
          - "*"
        exclude-patterns:
          - "csharpier"
          - "husky"
          - "dotnet-outdated-tool"

  - package-ecosystem: "nuget"
    target-branch: "develop"
    directory: "/"
    schedule:
      interval: "daily"
    groups:
      nuget-deps:
        patterns:
          - "*"
        exclude-patterns:
          - "csharpier"
          - "husky"
          - "dotnet-outdated-tool"

  # The "/" directory covers only .github/workflows and a root action.yml.
  # A repo carrying its own composite actions under .github/actions, such as a validate hook, keeps the second glob so their pins stay current.
  - package-ecosystem: "github-actions"
    target-branch: "main"
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: "daily"
    groups:
      actions-deps:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    target-branch: "develop"
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: "daily"
    groups:
      actions-deps:
        patterns:
          - "*"

  # The uv directory points at the Python package root (e.g. /PackageName).
  # Adjust it per repo layout.
  - package-ecosystem: "uv"
    target-branch: "main"
    directory: "/PythonPackage"
    schedule:
      interval: "daily"
    groups:
      pypi-deps:
        patterns:
          - "*"
        exclude-patterns:
          - "ruff"
          - "pyright"
          - "mypy"

  - package-ecosystem: "uv"
    target-branch: "develop"
    directory: "/PythonPackage"
    schedule:
      interval: "daily"
    groups:
      pypi-deps:
        patterns:
          - "*"
        exclude-patterns:
          - "ruff"
          - "pyright"
          - "mypy"

  # The pip pair is kept only by a repo with a pip-form Python directory, a requirements*.txt with no uv.lock.
  # Its directory points at that Python directory, so adjust it per repo layout.
  - package-ecosystem: "pip"
    target-branch: "main"
    directory: "/PythonProject"
    schedule:
      interval: "daily"
    groups:
      pypi-deps:
        patterns:
          - "*"
        exclude-patterns:
          - "ruff"
          - "pyright"
          - "mypy"

  - package-ecosystem: "pip"
    target-branch: "develop"
    directory: "/PythonProject"
    schedule:
      interval: "daily"
    groups:
      pypi-deps:
        patterns:
          - "*"
        exclude-patterns:
          - "ruff"
          - "pyright"
          - "mypy"
