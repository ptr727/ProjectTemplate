# Reference: multi-ecosystem dual-target Dependabot config for a code-shipping repo.
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# Every ecosystem appears twice, once per target branch (main and develop).
# Both branches therefore stay current on dependency versions independently of the release cadence.
# Push-distribution channels (HACS, distros that pull main) consume main directly.
# The main branch must therefore get bumps without waiting for the next release.
# The merge-bot dispatches the merge method per base ref (squash on develop, merge on main).
# Because develop is strictly forward-only, each branch absorbs its own PRs.
# Security (CVE) PRs always target the default branch regardless of target-branch.
# Keep only the ecosystems the repo actually ships.
#
# Each group's exclude-patterns keeps the fleet's own lint/format toolchain packages out of the catch-all bump.
# A formatter or linter version bump can change its own output or rule set and start flagging previously-compliant code it never touched.
# Grouping it with unrelated dependency bumps would then block all of them together on one tool's reformat/relint debt.
# Excluded packages instead get their own individual PR, diagnosed and merged (or held) on its own.
version: 2
updates:

  - package-ecosystem: "nuget"
    target-branch: "main"
    directory: "/"
    schedule:
      interval: "daily"
    groups:
      nuget-deps:
        patterns:
          - "*"
        exclude-patterns:
          - "csharpier"
          - "husky"
          - "dotnet-outdated-tool"

  - package-ecosystem: "nuget"
    target-branch: "develop"
    directory: "/"
    schedule:
      interval: "daily"
    groups:
      nuget-deps:
        patterns:
          - "*"
        exclude-patterns:
          - "csharpier"
          - "husky"
          - "dotnet-outdated-tool"

  - package-ecosystem: "github-actions"
    target-branch: "main"
    directory: "/"
    schedule:
      interval: "daily"
    groups:
      actions-deps:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    target-branch: "develop"
    directory: "/"
    schedule:
      interval: "daily"
    groups:
      actions-deps:
        patterns:
          - "*"

  # The uv directory points at the Python package root (e.g. /PackageName).
  # Adjust it per repo layout.
  - package-ecosystem: "uv"
    target-branch: "main"
    directory: "/PythonPackage"
    schedule:
      interval: "daily"
    groups:
      pypi-deps:
        patterns:
          - "*"
        exclude-patterns:
          - "ruff"
          - "pyright"
          - "mypy"

  - package-ecosystem: "uv"
    target-branch: "develop"
    directory: "/PythonPackage"
    schedule:
      interval: "daily"
    groups:
      pypi-deps:
        patterns:
          - "*"
        exclude-patterns:
          - "ruff"
          - "pyright"
          - "mypy"
